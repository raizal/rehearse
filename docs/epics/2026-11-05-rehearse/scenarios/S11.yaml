story: S11
scenarios:
  - id: S11-brief
    title: The brief of a signed story holds everything the agent builds to
    status: approved
    steps:
      - { name: sign-off }
      - name: watch-build
        example: { id: signed-story, given: { storyId: S1, signed: true, stale: false }, then: { button: Build with an agent } }
      - { name: start-build }
      - name: build-brief
        example:
          id: brief-content
          given: { storyId: S1 }
          then:
            header: [ signed by, signed at, rule-2 hash, matches the signed story ]
            sections: [ Story, Approved scenarios, Boxes, Decisions, Entities, How to work in this repo ]
            draftsApart: true
            underTokens: 6000
      - { name: watch-build }
    expect: { criterion: S11-A1, state: { briefSections: 6, draftsListedApart: true, tokens: "< 6000" } }
    approval:
      by: raizal.pregnanta@systemearth.com
