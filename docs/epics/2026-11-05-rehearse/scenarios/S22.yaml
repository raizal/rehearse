# S22: every scenario a branch of the story's main path, on one map (T57). Drafts for the owner.
# S22-collapsed-seen is the main path (open the map, a branch highlighted, its opening collapsed, approve);
# the others share its opening and leave it where they differ.
story: S22
scenarios:
- id: S22-collapsed-seen
  title: The shared opening is one row; steps seen on the main path count, and Approve turns on after the different part
  status: draft
  steps:
  - name: review/readiness
  - name: main-path
    example:
      id: derived
      given:
        storyId: S18
      then:
        storyId: S18
        mainPath: S18-opening
        source: derived
  - name: branch-point
    example:
      id: s18
      given:
        storyId: S18
        mainPath: S18-opening
      then:
        storyId: S18
        mainPath: S18-opening
        scenarioId: S18-single-file
        shared: 3
        branchAt: Write the deck
        condition: the example has another deck file
        rejoin: The owner sends the deck
  - name: review-order
    example:
      id: s18-order
      given:
        storyId: S18
        mainPath: S18-opening
      then:
        storyId: S18
        order: [S18-opening, S18-single-file, S18-no-chromium, S18-present-button]
  - name: story-map
    example:
      id: glance
      given:
        storyId: S18
        order: [S18-opening, S18-single-file, S18-no-chromium, S18-present-button]
      then:
        storyId: S18
        scenarioId: S18-single-file
  - name: highlight-scenario
    example:
      id: branch
      given:
        scenarioId: S18-single-file
      then:
        scenarioId: S18-single-file
        header: 'Branch of the main path at Write the deck: when the example has another deck file'
        marker: 'Branches here: when the example has another deck file'
        rejoin: Joins the main path again
  - name: collapse-shared
    example:
      id: seen-on-main
      given:
        scenarioId: S18-single-file
      then:
        scenarioId: S18-single-file
        shared: 3
        startAt: 4
        seen: 3
  - name: approve
    example:
      id: approve-branch
      given:
        scenarioIds: [S18-single-file]
      then:
        approvals:
        - scenario: S18-single-file
          sigStatus: valid
  expect:
    criterion: S22-A7
    state:
      row: Same as the main path up to Build the slides in plain words (3 steps)
      rowSays: seen on the main path
      playbackStartsAt: 4
      approve: on after every step was seen
