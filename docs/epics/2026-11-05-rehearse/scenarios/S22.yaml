    branch: no scenario without an error edge
    example:
      id: all-errors
      given:
        storyId: S9
      then:
        exit: no scenario without an error edge
  - name: branch-point
    example:
      id: first
      given:
        storyId: S9
        mainPath: S9-first
      then:
        storyId: S9
        mainPath: S9-first
        scenarioId: S9-second
        shared: 1
        branchAt: Run the gate
        condition: it takes the error exit "gate fails"
  - name: review-order
    example:
      id: s9-order
      given:
        storyId: S9
        mainPath: S9-first
      then:
        storyId: S9
        order: [S9-first, S9-second]
  - name: story-map
    example:
