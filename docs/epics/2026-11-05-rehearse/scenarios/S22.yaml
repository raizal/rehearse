        storyId: S9
        scenarioId: S9-first
        note: 'Every scenario of this story takes an error exit: the first one is shown as the main path.'
  expect:
    criterion: S22-A1
    state:
      mainPath: S9-first
      source: fallback
      said: 'Every scenario of this story takes an error exit: the first one is shown as the main path.'
