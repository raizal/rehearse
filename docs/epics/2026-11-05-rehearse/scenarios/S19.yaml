story: S19
scenarios:

  - id: S19-recap
    title: The slide after the title is a recap of every story, done or not, with one sentence on top
    status: draft
    steps:
      - name: present-cli
        example: { id: cli, given: { epic: 2026-11-05-rehearse }, then: { epic: 2026-11-05-rehearse } }
      - name: gather-deck-facts
        example: { id: facts, given: { epic: 2026-11-05-rehearse }, then: { epic: 2026-11-05-rehearse, commit: "main @ a33f854, 2026-11-07", uncommitted: false, facts: "19 stories, 5 designs, 40 tests" } }
      - { name: read-saved-test-results }
      - { name: read-unit-report }
      - { name: last-screen-picture }
      - name: story-done-state
        example: { id: states, then: { epic: 2026-11-05-rehearse, commit: "main @ a33f854, 2026-11-07", uncommitted: false, facts: "19 stories, 5 designs, 40 tests", doneStates: "12 done, 4 in progress, 3 not started" } }
      - name: build-recap
        example: { id: recap, then: { epic: 2026-11-05-rehearse, commit: "main @ a33f854, 2026-11-07", uncommitted: false, facts: "19 stories, 5 designs, 40 tests", doneStates: "12 done, 4 in progress, 3 not started", recap: "12 of 19 stories are done" } }
      - { name: proof-lines }
      - { name: evidence-page }
      - name: build-deck
        example: { id: deck, then: { epic: 2026-11-05-rehearse, slides: 43, deck: "title; recap: 12 of 19 stories are done; why; big picture" } }
      - name: render-deck-html
        example: { id: html, then: { epic: 2026-11-05-rehearse, html: presentations/2026-11-05-rehearse-2026-11-07-a33f854.html, bytes: 4100000 } }
      - { name: deck-file }
    expect: { criterion: S19-A1, state: { secondSlide: recap, sentence: "12 of 19 stories are done", rows: 19, states: [done, in progress, not started] } }

