story: S8
scenarios:
  - id: S8-no-proof
    title: A requirement has no story
    status: approved
    approval: { by: raizal.pregnanta@systemearth.com, threadId: thr_zpd73mnmgy, at: '2026-11-05T06:49:06Z', hash: 'sha256:1ce2d5967eeae779c7b988bed25d2545f81f52c56f0ea7da52f5e91538f92817', note: bootstrap }
    steps:
      - name: review/readiness
        example: { id: ready-no-proof, given: { requirements: [R2], stories: [] }, then: { noProof: [{ id: R2, reason: "no story" }] } }
    expect: { criterion: S8-A1, state: { R2: no-proof } }

  - id: S8-no-requirement
    title: A box serves no requirement
    status: approved
    approval: { by: raizal.pregnanta@systemearth.com, threadId: thr_zpd73mnmgy, at: '2026-11-05T06:49:06Z', hash: 'sha256:f73ec600be0420271c205455f790d9f040ecb008cecaa5382cd43301eef9b3a6', note: bootstrap }
    steps:
      - name: review/readiness
        example: { id: ready-orphan, given: { boxes: { pay: { stories: [] } } }, then: { noRequirement: [pay] } }
    expect: { criterion: S8-A2, state: { noRequirement: [pay] } }

  - id: S8-counts
    title: Correction counts by tag
    status: approved
    approval: { by: raizal.pregnanta@systemearth.com, threadId: thr_zpd73mnmgy, at: '2026-11-05T06:49:06Z', hash: 'sha256:0a54e1529bc7811cfea870632d97b2a02ffd7a63dd998ea595ef01296e87200e', note: bootstrap }
    steps:
      - name: review/readiness
        example: { id: ready-counts, given: { corrections: [sim, sim, sim, build] }, then: { counts: { caught-in-simulation: 3, caught-after-build: 1 } } }
    expect: { criterion: S8-A3, state: { caught-in-simulation: 3, caught-after-build: 1 } }
