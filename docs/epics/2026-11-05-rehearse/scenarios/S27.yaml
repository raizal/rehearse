  - id: S27-main
    title: An agent adds a small change to a signed story, and the owner approves it and signs off again
    status: approved
    steps:
      - { name: start }
      - name: change-new
        example: { id: start-file, given: { epic: 2026-11-05-rehearse, story: S21, title: "The Next button shows a count of scenarios left." }, then: { file: changes/C1.yaml, criteria: [ S21-A7 ], scenarios: [ S21-c1-main ] } }
      - name: change-file
        example: { id: write, given: { change: C1 }, then: { criteria: "S21-A7", scenarios: "S21-c1-main, S21-c1-last, S21-c1-none" } }
      - { name: change-limits }
      - { name: change-signoff }
      - { name: change-shown }
      - { name: change-done }
