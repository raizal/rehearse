  - id: S21-focus-after-approve
    title: After a successful approval focus moves to Next scenario, and Enter follows it
    status: approved
    steps:
      - { name: review/readiness }
      - { name: happy, branch: approve }
      - { name: signing-key, branch: "yes" }
      - name: approve
        example: { id: approve-one, given: { scenarioIds: [ S16-link-page ] }, then: { approvals: [ { scenario: S16-link-page, sigStatus: valid } ] } }
      - name: after-approve
        example: { id: focus, given: { outcome: ok }, then: { scenarioId: S16-link-page, focus: "Next scenario →" } }
      - name: next-scenario
        example: { id: enter, given: { scenarioId: S16-link-page, key: Enter }, then: { scenarioId: S16-link-frame, storyId: S16, place: "3 of 8 in S16" } }
      - { name: review/swimlanes }
