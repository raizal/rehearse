story: S26
scenarios:

  - id: S26-main-path-done
    title: The test thread writes the main path test, it passes on the real screens, and the story is done
    status: approved
    steps:
      - name: write-tests
        example: { id: click, given: { epic: 2026-11-05-rehearse, story: S10 }, then: { storyId: S10 } }
      - { name: test-thread }
      - { name: e2e-start }
      - name: main-path-test
        example: { id: passed, given: { specFile: e2e/tests/S10.spec.ts }, then: { run: "S10-pass passed on the real screens" } }
      - name: done-seen
        example: { id: done, given: { signed: yes, stale: no, built: "all boxes", mainPath: passed, failing: 0 }, then: { done: "done · main path seen working" } }
      - { name: done-shown }
      - { name: seen-known }
    expect: { criterion: S26-A6, state: { S10: done, rule: "signed, not stale, built, main path passed in its last run, no test fails" } }
