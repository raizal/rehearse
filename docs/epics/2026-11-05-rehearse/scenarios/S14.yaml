  - id: S14-summary
    title: The thread panel shows what the build thread's branch brings that the current branch has not
    status: approved
    steps:
      - { name: watch-build }
      - { name: merge-panel }
      - name: thread-branch
        example: { id: two-commits, given: { storyId: S4, kind: build, branch: bb/build-s4, current: main }, then: { commits: [ "T49: drill into a box", "T49: back to the parent" ], files: [ packages/ui/src/Drill.tsx, packages/ui/test/drill.test.tsx ] } }
      - name: merge-panel
        example: { id: summary-text, given: { storyId: S4, kind: build }, then: { text: "2 commits in the thread, not in main yet", decision: merge } }
    expect: { criterion: S14-A1, state: { commits: 2, files: 2, button: Merge into main } }
    approval:
