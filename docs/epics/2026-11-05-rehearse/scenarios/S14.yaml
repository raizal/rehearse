story: S14
scenarios:
  - id: S14-summary
    title: The thread panel shows what the build thread's branch brings that the current branch has not
    status: draft
    steps:
      - { name: watch-build }
      - { name: merge-panel }
      - name: thread-branch
        example: { id: two-commits, given: { storyId: S4, kind: build, branch: bb/build-s4, current: main }, then: { commits: [ "T49: drill into a box", "T49: back to the parent" ], files: [ packages/ui/src/Drill.tsx, packages/ui/test/drill.test.tsx ] } }
      - name: merge-panel
        example: { id: summary-text, given: { storyId: S4, kind: build }, then: { text: "2 commits in the thread, not in main yet", decision: merge } }
    expect: { criterion: S14-A1, state: { commits: 2, files: 2, button: Merge into main } }

  - id: S14-merge
    title: Merge into main merges the idle thread's branch with --no-ff and the thread's title
    status: draft
    steps:
      - { name: merge-panel }
      - { name: thread-branch }
      - { name: merge-panel }
      - name: merge-thread
        example: { id: merge-no-ff, given: { storyId: S4, kind: build, thread: { status: idle, title: Build S4 } }, then: { git: "git merge --no-ff bb/build-s4", message: "Merge Build S4", trailer: "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" } }
      - name: merge-panel
        example: { id: nothing-left, given: { storyId: S4, kind: build }, then: { text: "Nothing in the thread that main does not have." } }
    expect: { criterion: S14-A2, state: { merged: true, commitsLeft: 0 } }

  - id: S14-dirty
    title: Uncommitted changes in a file the merge touches stop the merge and change nothing
    status: draft
    steps:
      - { name: merge-panel }
      - name: merge-thread
        branch: "uncommitted changes"
        example: { id: dirty-file, given: { storyId: S4, kind: build, dirty: [ packages/ui/src/Drill.tsx ] }, then: { http: 409, error: "The checkout has uncommitted changes in files the merge touches: packages/ui/src/Drill.tsx. Commit or put them aside, then merge." } }
      - { name: merge-panel }
    expect: { criterion: S14-A3, state: { merged: false, headMoved: false } }

  - id: S14-conflict
    title: A conflicting merge is aborted, its files listed, and the thread can be asked to rebase
    status: draft
    steps:
      - { name: merge-panel }
      - name: merge-thread
        branch: "merge conflict"
        example: { id: conflict-abort, given: { storyId: S4, kind: tests, conflicts: [ e2e/tests/S4.spec.ts ] }, then: { http: 409, aborted: true, files: [ e2e/tests/S4.spec.ts ], offer: Ask the thread to rebase } }
      - name: merge-panel
        example: { id: ask-rebase, given: { storyId: S4, kind: tests, decision: ask-rebase }, then: { tell: "bb thread tell thr_tests1" } }
    expect: { criterion: S14-A3, state: { merged: false, mergeInProgress: false, told: 1 } }

  - id: S14-working
    title: A thread that is still working cannot be merged
    status: draft
    steps:
      - { name: merge-panel }
      - name: merge-thread
        branch: "thread still working"
        example: { id: still-working, given: { storyId: S4, kind: build, thread: { status: working } }, then: { http: 409, error: "The thread is still working (bb says working). Merge when bb says it is idle." } }
      - { name: merge-panel }
    expect: { criterion: S14-A3, state: { merged: false, button: none } }

  - id: S14-nothing-new
    title: A branch with nothing the current branch lacks has nothing to merge
    status: draft
    steps:
      - { name: test-rows }
      - { name: merge-panel }
      - name: thread-branch
        branch: "nothing new"
        example: { id: nothing-new, given: { storyId: S1, kind: tests, branch: bb/tests-s1, current: main }, then: { commits: [], text: "Nothing in the thread that main does not have." } }
      - { name: merge-panel }
    expect: { criterion: S14-A3, state: { merged: false, button: none } }

  - id: S14-play
    title: After a test merge the rows say not run and one button plays the new tests in Birdview
    status: draft
    steps:
      - { name: test-rows }
      - { name: merge-panel }
      - name: merge-thread
        example: { id: tests-merged, given: { storyId: S1, kind: tests }, then: { scenarios: [ S1-new ], files: [ e2e/tests/S1.spec.ts ] } }
      - name: merge-panel
        example: { id: play-button, given: { storyId: S1, scenarios: [ S1-new ] }, then: { rows: { S1-new: not run }, button: Play the new tests in Birdview, decision: play } }
      - { name: story-playlist }
      - { name: play-story }
    expect: { criterion: S14-A4, state: { rows: { S1-new: not run }, played: [ S1-new ] } }

  - id: S14-briefs
    title: The build and test briefs say commit on the thread's branch, stop, and set up first
    status: draft
    steps:
      - { name: build-brief }
      - name: work-rules
        example: { id: commit-and-stop, given: { storyId: S4 }, then: { lines: [ "Commit on your thread's branch. Do not merge, push or rebase onto main yourself, and never turn the sandbox off.", "pnpm install --frozen-lockfile && pnpm -r build" ] } }
    expect: { criterion: S14-A5, state: { commitAndStop: true, setupFirst: true } }

  - id: S14-play-wait
    title: An agent plays a test in Birdview and waits for passed or failed
    status: draft
    steps:
      - { name: draft-record }
      - name: play-wait
        example: { id: wait-passed, given: { story: S1, test: "tests/S1.spec.ts:24" }, then: { stdout: "passed tests/S1.spec.ts:24 (S1-new)", exitCode: 0 } }
      - { name: play-story }
    expect: { criterion: S14-A6, state: { exitCodes: { passed: 0, failedOrTimeout: 1, badArgument: 2 } } }

  - id: S14-fixtures
    title: The test brief says where each expected result shows and which fixture to start from
    status: draft
    steps:
      - { name: test-brief }
      - name: work-rules
        example: { id: cli-scenario, given: { storyId: S1, scenarios: [ S1-new ] }, then: { whereShown: "files: not shown in the UI, check the files", fixture: "e2e/tests/cli.ts" } }
    expect: { criterion: S14-A7, state: { whereShown: true, fixtureNamed: true } }
