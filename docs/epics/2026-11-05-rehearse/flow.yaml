# rehearse v1 — flow (to-be). As-is is empty: this is a new product. (D4)
# Status: draft.
# Box contract (D10): inputs, outputs, reads, writes, sideEffects, errorExits,
# stories, lane. Each error exit is an edge with kind: error.
# Each box names the package that builds it (`package:`, C36) and may name the
# decisions behind it (`decisions:`, C37). A box gets its code from `Flow-Box:`
# commit trailers only (D44).

version: 1
epic: 2026-11-05-rehearse
# Every box has these fields as inputs without declaring them. (C14)
context: { epicDir: string }

lanes:
  - { role: builder, order: 1 }
  - { role: agent,   order: 2 }
  - { role: rehearse, order: 3 }   # the tool itself (system)
  - { role: ci,      order: 4 }   # an external CI service, not rehearse (C36)

root:
  boxes:
    - id: start
      kind: start
      lane: builder
      package: cli
      title: Builder has an idea

    - id: new-epic
      kind: input
      lane: builder
      package: cli
      title: Create EPIC record
      stories: [S1]
      inputs:  { slug: string, title: string }
      outputs: { epicDir: string }
      writes:  [Epic.slug, Epic.title, "Epic.status:->draft"]
      sideEffects: [creates docs/epics/<slug>/ with the smallest valid record]
      errorExits: [epic-exists, bad-slug]
      # A missing or empty title is a usage error (exit 2), not an error exit. (C20)

    - id: rejected
      kind: end
      lane: builder
      package: cli
      title: Command fails, no file changed

    - id: draft-record
      kind: process
      lane: agent
      package: cli
      title: Draft or fix record files
      stories: [S2]
      inputs:  { epicDir: string, findings: "list Finding?" }
      outputs: { epicDir: string }
      # Agents draft story text only. Story.status and Story.signedHash belong to builder and rehearse. (C16)
      writes:  [Requirement.*, Story.role, Story.want, Story.soThat, Story.requirements, Story.acceptance,
                Box.*, Example.*, "Scenario.status:->draft"]
      sideEffects: [edits YAML files in the EPIC folder]

    - id: validate
      kind: process
      lane: rehearse
      package: core
      title: Validate record
      stories: [S2]
      inputs:  { epicDir: string }
      outputs: { report: Report }
      reads:   [Epic.*, Requirement.*, Story.*, Box.*, Scenario.*]
      children:
        boxes:
          - { id: parse,       kind: process,  lane: rehearse, package: core, title: Parse YAML files,
              inputs: { epicDir: string }, outputs: { docs: map }, errorExits: [yaml-syntax] }
          - { id: schema,      kind: process,  lane: rehearse, package: core, title: Check JSON Schema,
              inputs: { docs: map }, outputs: { docs: map, findings: list Finding } }
          - { id: refs,        kind: process,  lane: rehearse, package: core, title: Check cross-file references,
              inputs: { docs: map }, outputs: { findings: list Finding } }
          - { id: report,      kind: output,   lane: rehearse, package: core, title: Write validation report,
              inputs: { findings: list Finding }, outputs: { report: Report } }
        edges:
          - { from: parse,  to: schema }
          - { from: parse,  to: report, label: yaml-syntax, kind: error }
          - { from: schema, to: refs }
          - { from: refs,   to: report }

    - id: valid
      kind: decision
      lane: rehearse
      package: core
      title: Record valid?
      inputs: { report: Report }

    - id: simulate
      kind: process
      lane: rehearse
      package: core
      title: Simulate approved scenarios
      stories: [S3, S7]
      inputs:  { epicDir: string }
      outputs: { report: Report }
      reads:   [Box.*, Example.*, Scenario.*, Story.acceptance, Requirement.*]
      children:
        boxes:
          - { id: load,        kind: process, lane: rehearse, package: core, title: Load approved scenarios (skip stale and draft),
              inputs: { epicDir: string }, outputs: { scenarios: list Scenario }, reads: [Scenario.status, Approval.hash] }
          - { id: contracts,   kind: process, lane: rehearse, package: core, title: Chain examples and check data shapes,
              inputs: { scenarios: list Scenario }, outputs: { scenarios: list Scenario, findings: list Finding } }
          - { id: coverage,    kind: process, lane: rehearse, package: core, title: Find branches and error exits that no scenario reaches,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { scenarios: list Scenario, findings: list Finding } }
          - { id: lifecycles,  kind: process, lane: rehearse, package: core, title: Check transitions and reachable states,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { scenarios: list Scenario, findings: list Finding }, reads: [Box.writes] }
          - { id: acceptance,  kind: process, lane: rehearse, package: core, title: Compare end states with acceptance criteria,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { scenarios: list Scenario, findings: list Finding }, reads: [AcceptanceCriterion.expectedState] }
          - { id: permissions, kind: process, lane: rehearse, package: core, title: Build permission matrix,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { findings: list Finding, matrix: map }, reads: [Lane.role, Box.reads, Box.writes] }
          - { id: report,      kind: output,  lane: rehearse, package: core, title: "Write sorted, deterministic report",
              inputs: { findings: list Finding, matrix: map }, outputs: { report: Report } }
        edges:
          - { from: load,        to: contracts }
          - { from: contracts,   to: coverage }
          - { from: coverage,    to: lifecycles }
          - { from: lifecycles,  to: acceptance }
          - { from: acceptance,  to: permissions }
          - { from: permissions, to: report }

    - id: design-errors
      kind: decision
      lane: rehearse
      package: core
      title: Design errors found?
      inputs: { report: Report }

    - id: log-correction
      kind: process
      lane: agent
      package: cli
      title: Log correction (caught-in-simulation)
      stories: [S8]
      inputs:  { report: Report }
      outputs: { correction: Correction }
      writes:  [Correction.*]
      sideEffects: [appends to corrections.md]

    - id: review
      kind: output
      lane: builder
      package: ui
      title: Review in panel
      stories: [S4, S5, S6, S7, S8]   # S6: the builder reviews each scenario before approving it (C30, C39)
      decisions: [D42]
      inputs:  { epicDir: string, report: "Report?" }
      outputs: { decision: "enum[approve, change]" }
      reads:   [Box.*, Scenario.*, Report.permissionMatrix, Correction.tag]
      children:
        boxes:
          - { id: swimlanes,   kind: output, lane: builder, package: ui, title: Swimlanes,
              inputs: { epicDir: string }, outputs: { view: "enum[bigpicture, drawer]" }, reads: [Box.*, Lane.*] }
          # playback is an input box: the builder's click gives scenarioId and step. (C15)
          # It lives on the scenario storyboard: a flowchart in role lanes, laid out by hand
          # (the path is one chain), and a step detail panel. (C41)
          - { id: playback,    kind: input,  lane: builder, package: ui, title: Play a scenario step by step,
              inputs: { scenarioId: string, step: number }, outputs: { highlighted: string }, reads: [Scenario.*, Example.*] }
          - { id: matrix,      kind: output, lane: builder, package: ui, title: Use case diagram (permissions),
              inputs: { epicDir: string }, outputs: { cells: "list string" }, reads: [Report.permissionMatrix] }
          - { id: readiness,   kind: output, lane: builder, package: ui, title: Readiness chain and correction counts,
              inputs: { epicDir: string }, outputs: { decision: "enum[approve, change]" }, reads: [Requirement.*, Story.*, Scenario.status, Approval.sig, Correction.tag] }   # C28: only a valid signature is proof
          # The S4 steps (C35): drill-down, big picture, story view and its Tests tab.
          - { id: drill,       kind: input,  lane: builder, package: ui, title: Open a box in the drawer; drill into its children,
              inputs: { click: string }, outputs: { shown: string, breadcrumb: "list string", edges: "list string" }, reads: [Box.*] }
          - { id: big-picture, kind: output, lane: builder, package: ui, title: "Big picture: every role, the main processes, one line per story",
              inputs: { epicDir: string }, outputs: { lines: "list string", shared: map }, reads: [Story.*, Box.stories, Lane.*] }
          - { id: story-view,  kind: input,  lane: builder, package: ui, title: "Story view: what, how, output, and the story thread",
              inputs: { story: string }, outputs: { panels: "list string" }, reads: [Story.*, AcceptanceCriterion.*, Box.*] }
          - { id: story-tests, kind: input,  lane: builder, package: ui, title: "Tests tab: test status in words, Birdview player",
              inputs: { story: string }, outputs: { tests: "list string" }, reads: [Scenario.*] }
        edges:
          - { from: swimlanes,   to: drill }
          - { from: swimlanes,   to: big-picture }
          - { from: swimlanes,   to: story-view }
          - { from: story-view,  to: story-tests }
          - { from: drill,       to: playback }
          - { from: big-picture, to: playback }
          - { from: story-tests, to: playback }
          - { from: swimlanes, to: playback }
          - { from: playback,  to: matrix }
          - { from: matrix,    to: readiness }

    - id: happy
      kind: decision
      lane: builder
      package: ui
      title: Design correct?
      stories: [S6]   # its approve branch starts the approval (C39)
      inputs: { decision: "enum[approve, change]" }

    - id: signing-key
      kind: decision
      lane: builder
      package: server
      title: Signing key?
      stories: [S6]
      decisions: [D41]
      inputs: { signingKey: "string?" }   # git config user.signingkey (C36)

    - id: no-key
      kind: end
      lane: builder
      package: ui
      title: Approve stays off, the signing guide is shown (C29)

    - id: approve
      kind: input
      lane: builder
      package: server
      title: Approve scenarios (UI button only)
      stories: [S6]
      decisions: [D41]
      inputs:  { scenarioIds: list string }
      outputs: { approvals: list Approval }
      writes:  ["Scenario.status:draft->approved", "Scenario.status:stale->approved", Approval.*]
      # No error exit: the CLI has no approve command (R13).
      # The UI shows a storyboard card per scenario and turns Approve on only after
      # every step was seen (C30). That is a review aid kept in the browser, not a trust control.

    - id: more-scenarios
      kind: decision
      lane: builder
      package: ui
      title: More scenarios to approve?
      stories: [S6]
      inputs: { approvals: list Approval }

    - id: gate
      kind: process
      lane: rehearse
      package: core
      title: Gate check
      stories: [S6, S9]   # S6: the gate counts only signed approvals as evidence (R13, D41)
      inputs:  { epicDir: string }
      outputs: { report: Report }
      reads:   [Requirement.*, Story.*, Scenario.status, Report.findings]
      children:
        boxes:
          - { id: traced,     kind: process, lane: rehearse, package: core, title: "Every requirement has a story, and every story has an approved scenario",
              inputs: { epicDir: string }, outputs: { findings: list Finding }, reads: [Requirement.*, Story.*, Scenario.status] }
          - { id: sim-clean,  kind: process, lane: rehearse, package: core, title: Simulation has no findings,
              inputs: { findings: list Finding }, outputs: { findings: list Finding }, reads: [Report.findings] }
          - { id: no-stale,   kind: process, lane: rehearse, package: core, title: No stale scenario,
              inputs: { findings: list Finding }, outputs: { findings: list Finding }, reads: [Scenario.status, Story.status] }
          - { id: report,     kind: output,  lane: rehearse, package: core, title: Gate report,
              inputs: { findings: list Finding }, outputs: { report: Report } }
        edges:
          - { from: traced,    to: sim-clean }
          - { from: sim-clean, to: no-stale }
          - { from: no-stale,  to: report }

    - id: gate-ok
      kind: decision
      lane: rehearse
      package: core
      title: Gate passes?
      stories: [S6, S9]   # S6-approve passes it on the "no" branch (C39)
      inputs: { report: Report }

    - id: sign-off
      kind: input
      lane: builder
      package: server
      title: Sign off (UI button only)
      stories: [S9]
      decisions: [D17, D41]
      inputs:  { storyIds: list string }
      outputs: { signOff: SignOff }
      writes:  ["Story.status:draft->signed", "Story.status:stale->signed",
                "Epic.status:draft->signed", "Epic.status:partly-stale->signed", SignOff.*]
      # No error exit: the CLI has no sign-off command (R14).
      # Before the button, GET /api/sign-off/preview shows per story what the hash covers and
      # what changed since its last sign-off (from git; read only, never blocks). (C42, S9-A4)

    - id: signed
      kind: end
      lane: builder
      package: server
      title: EPIC signed — build may start

    - id: signed-edit
      kind: start
      lane: agent
      package: cli
      title: Someone edits signed content

    - id: content-changed
      kind: process
      lane: rehearse
      package: core
      title: Detect changed signed content
      stories: [S6, S9]
      decisions: [D23]
      inputs:  { epicDir: string }
      outputs: { staleStories: list string, staleScenarios: list string }
      reads:   [Story.signedHash, Approval.hash]
      writes:  ["Story.status:signed->stale", "Scenario.status:approved->stale",
                "Epic.status:signed->partly-stale"]

    - id: pr-opened
      kind: start
      lane: ci
      package: cli
      title: PR opened or updated

    - id: ci-run
      kind: external
      lane: ci
      package: cli
      title: CI runs validate, simulate, gate --json
      stories: [S10]
      inputs:  { epicDir: string }
      outputs: { exitCode: number, report: Report }
      # CI reads the record and writes nothing (C36).
      reads:   [Epic.*, Requirement.*, Story.*, Box.*, Scenario.*, Approval.*, SignOff.*]
      writes:  []
      sideEffects: [runs the same core library as validate, simulate and gate]

    - id: ci-ok
      kind: decision
      lane: ci
      package: cli
      title: Exit code 0?
      inputs: { exitCode: number }

    - id: ci-pass
      kind: end
      lane: ci
      package: cli
      title: PR may merge

    - id: ci-fail
      kind: end
      lane: ci
      package: cli
      title: PR blocked, report attached

    # --- Hand a signed story to a bb thread, and watch its work (S11, T44) ---
    # New boxes only: sign-off, content-changed and review stay as they are; root edges join them.
    - id: watch-build
      kind: output
      lane: builder
      package: ui
      title: The story's build panel - Build button, plan-changed notice and progress
      stories: [S11]
      inputs:  { epicDir: string }
      outputs: { storyId: string, decision: "enum[build, send-change, ask]" }
      reads:   [Story.*, Box.*, Scenario.*, SignOff.*]
      errorExits: ["story not signed or stale"]
      # Signed and not stale: "Build with an agent". Unsigned or stale: why, and "Start a question
      # thread" (the error exit). A build link whose plan hash differs from now: "the plan changed
      # since this thread started" and "Send the change". The progress block, above the messages:
      # thread status and last activity; per box built or not yet, commits, branch, coverage; per
      # approved scenario its e2e test found, passing, failing or missing ("not run yet"); gate
      # findings and whether the sign-off holds; "N of M boxes have code · K of L scenarios tested".
      # GET /api/story-progress[?story=] reads git, the bb thread, the playlist and the graph;
      # without ?story= it gives the overview column of the Stories list. `rehearse progress` prints it.

    - id: start-build
      kind: input
      lane: builder
      package: server
      title: Start a build thread, or send it the change
      stories: [S11]
      inputs:  { storyId: string }
      outputs: { storyId: string, thread: string, hash: hash, at: datetime }
      reads:   [Story.*, SignOff.*]
      sideEffects: [bb thread spawn --new-environment worktree --base-branch <current>, bb thread tell]
      # POST /api/story-thread/build (token and Origin) checks the story again: 409 when unsigned or
      # stale. --model and --reasoning-level only when the serve options or the plugin settings set
      # them. The link file keeps the thread, the hash and the time. POST /api/story-thread/send-change
      # tells the thread what changed, before and now. Never an approve or sign-off.

    - id: build-brief
      kind: process
      lane: rehearse
      package: core
      title: Make the build brief of a signed story
      stories: [S11]
      inputs:  { storyId: string }
      outputs: { brief: string, hash: hash }
      reads:   [Story.*, Requirement.*, AcceptanceCriterion.*, Scenario.*, Box.*, SignOff.*]
      # Header (signed by, at, rule-2 hash, matches), story, requirements and criteria, approved
      # scenarios (given / when / then, expect; drafts apart), serving boxes with contracts,
      # children and edges, decisions, entities, and how to work (the same lines as the skill).
      # Under about 6k tokens. `rehearse brief <epic> <story>` prints it; it refuses a stale or
      # unsigned story unless --allow-unsigned.

    # --- Play a story's e2e tests in Birdview with one button (S12, T45) ---
    # New boxes only: review, story-tests and playback stay as they are; root edges join them.
    - id: story-playlist
      kind: output
      lane: builder
      package: ui
      title: Story playlist and Play in Birdview
      stories: [S12]
      inputs:  { storyId: string }
      outputs: { storyId: string, decision: "enum[play, play-test, switch-back]", test: "string?", to: "enum[this, default]?" }
      reads:   [Story.*, Scenario.*]
      # GET /api/birdview?story= builds the playlist from the record and the spec files (as
      # `rehearse playlists`), and reads the player's project, playlist and default project.
      # "Birdview: <project> · playlist <name>"; on another project "Birdview is on <it>. Play will
      # switch it to this repo." and "Switch back". A ▶ per test. Busy and not running in words.

    - id: play-story
      kind: input
      lane: builder
      package: server
      title: Play the story in Birdview
      stories: [S12]
      inputs:  { storyId: string, test: "string?" }
      outputs: { storyId: string, project: string, playlist: string, played: "list string" }
      sideEffects: [Birdview POST /api/project, Birdview POST /api/playlist, Birdview POST /api/play]
      errorExits: ["Birdview busy", "Birdview not running"]
      # POST /api/birdview/play-story and /play-test (token and Origin). One try: 409 is "Birdview
      # is busy, try again", no answer is "Birdview is not running; open it from the bb sidebar".

    - id: use-project
      kind: input
      lane: builder
      package: server
      title: Switch Birdview back
      stories: [S12]
      inputs:  { storyId: string, to: "enum[this, default]" }
      outputs: { storyId: string, project: string }
      sideEffects: [Birdview GET /api/projects, Birdview POST /api/project]
      errorExits: ["Birdview busy"]
      # POST /api/birdview/use-project (token and Origin). The default is the player's projectDir setting.

    - id: play-cli
      kind: input
      lane: agent
      package: cli
      title: rehearse play and playlists --push
      stories: [S12]
      inputs:  { story: string, test: "string?" }
      outputs: { storyId: string, test: "string?", exitCode: number }
      # The same calls as the Tests tab; exit 1 when busy or not running, 2 on a bad argument.

    # --- Hand a scenario without an e2e test to an agent (S13, T47) ---
    # New boxes only: story-playlist, start-build and build-brief stay as they are; root edges join them.
    - id: test-rows
      kind: output
      lane: builder
      package: ui
      title: No-test rows and the story's test thread on the Tests tab
      stories: [S13]
      inputs:  { storyId: string }
      outputs: { storyId: string, decision: "enum[write-one, write-missing, send]", scenarios: "list string" }
      reads:   [Story.*, Scenario.status]
      # A no-test row of an approved scenario: "Write this test with an agent". A draft or stale
      # one: "approve this scenario first", no button. The summary: "Write the K missing tests with
      # an agent" (one thread). The rows of the test thread: status words, last activity, @thread;
      # then "test written, not run yet". While it works, the buttons send to it instead.

    - id: start-test-thread
      kind: input
      lane: builder
      package: server
      title: Start the story's test thread, or send it more scenarios
      stories: [S13]
      inputs:  { storyId: string, scenarios: "list string?" }
      outputs: { storyId: string, thread: string, scenarios: "list string", hash: hash, at: datetime }
      reads:   [Story.*, Scenario.status]
      sideEffects: [bb thread spawn --new-environment worktree --base-branch <current>, bb thread tell]
      errorExits: ["scenario not approved"]
      # POST /api/story-tests/thread and /send (token and Origin). Title "Tests: <story> <ids>".
      # One test thread per story at a time: a second start while it works is 409, send instead.
      # The link goes in .rehearse/story-threads.json as the story's `tests` entry.

    - id: test-brief
      kind: process
      lane: rehearse
      package: core
      title: Make the test brief of approved scenarios
      stories: [S13]
      inputs:  { storyId: string, scenarios: "list string" }
      outputs: { storyId: string, brief: string, specFile: string, hash: hash }
      reads:   [Story.*, AcceptanceCriterion.*, Scenario.*, Box.*]
      # Story sentence; per scenario the criterion, steps with their boxes, examples and expect;
      # the spec file and the test name (the Tests tab's rule, quoted); an example spec; how to
      # run it; write only tests; how to work. Refuses a draft or stale scenario.

    - id: test-brief-cli
      kind: input
      lane: agent
      package: cli
      title: rehearse brief --tests
      stories: [S13]
      inputs:  { story: string, scenarios: "list string?" }
      outputs: { storyId: string, scenarios: "list string", brief: string, exitCode: number }
      # Default: the approved scenarios without a test. Exit 1 on a draft or stale scenario or
      # none missing, 2 on a bad argument.

    # --- Agent threads land their work through the owner (S14, T48) ---
    # New boxes only: watch-build, test-rows, play-story, build-brief and test-brief stay as they
    # are; root edges join them.
    - id: thread-branch
      kind: process
      lane: rehearse
      package: server
      title: What the thread's branch has that the current branch has not
      stories: [S14]
      inputs:  { storyId: string, kind: "enum[build, tests]" }
      outputs: { storyId: string, branch: string, current: string, commits: "list string", files: "list string", scenarios: "list string" }
      reads:   [Story.*, Scenario.*]
      errorExits: ["nothing new"]
      # The branch from `bb thread show --json` (environment.branchName); the commits are
      # `git log <current>..<branch>`, the files `git diff --name-only <current>...<branch>`; for a
      # test thread, the scenario rows its new tests fill. GET /api/thread/merge (token and Origin).

    - id: merge-panel
      kind: output
      lane: builder
      package: ui
      title: The merge summary, Merge into <current branch>, and play after a test merge
      stories: [S14]
      inputs:  { storyId: string }
      outputs: { storyId: string, kind: "enum[build, tests]", decision: "enum[merge, ask-rebase, play]" }
      reads:   [Story.*, Scenario.*]
      # On the story's thread panel (build) and its Tests tab (tests): "N commits in the thread, not
      # in <current> yet", the subjects and files, the rows they fill; "Merge into <current>" with a
      # confirm; a refusal in plain words; after a test merge "Play the new tests in Birdview".

    - id: merge-thread
      kind: input
      lane: builder
      package: server
      title: Merge the thread's branch into serve's checkout
      stories: [S14]
      inputs:  { storyId: string, kind: "enum[build, tests]" }
      outputs: { storyId: string, merged: string, commits: number, files: "list string", scenarios: "list string" }
      reads:   [Story.*]
      sideEffects: [git merge --no-ff <branch>, git merge --abort, bb thread tell (ask to rebase)]
      errorExits: ["uncommitted changes", "merge conflict", "thread still working"]
      # POST /api/thread/merge {story, kind} (token and Origin), an owner action: no CLI command,
      # and the briefs say agents never call it. Message "Merge <thread title>" and the repo's
      # Co-Authored-By line. Every refusal leaves HEAD, the index and the files as they were.

    - id: work-rules
      kind: process
      lane: rehearse
      package: core
      title: How an agent lands its work, sets up and runs e2e tests, in every brief
      stories: [S14]
      inputs:  { brief: string }
      outputs: { storyId: string, lines: "list string", whereShown: "list string", fixture: string }
      reads:   [Box.*, Scenario.*]
      # One "how to work" source for the build brief, the test brief and the skill: commit on the
      # thread's branch and stop, set up first, play e2e tests with `pnpm rehearse play … --wait`.
      # The test brief adds, per scenario, where each expected result shows and the fixture.

    - id: play-wait
      kind: input
      lane: agent
      package: cli
      title: pnpm rehearse play --wait
      stories: [S14]
      inputs:  { story: string, test: "string?", timeout: "number?" }
      outputs: { storyId: string, results: "list string", exitCode: number }
      # The root script `pnpm rehearse` runs packages/cli/bin/rehearse.js. --wait waits for the
      # run to end in Birdview and prints passed / failed (with the failed step): exit 0 / 1;
      # no result before --timeout exits 1; a bad argument exits 2.

    # --- The brief hands the agent the code that already builds each box (S15, T49) ---
    # New boxes only: start-build, build-brief, start-test-thread, test-brief and test-brief-cli
    # stay as they are; root edges join them.
    - id: gather-box-code
      kind: process
      lane: rehearse
      package: server
      title: Gather the code of the boxes from the code graph
      stories: [S15]
      inputs:  { storyId: string, scenarios: "list string?" }
      outputs: { storyId: string, scenarios: "list string?", code: "list string", cli: string, codeUnavailable: "string?" }
      reads:   [Box.*]
      errorExits: ["graph not available"]
      # The boxes: the story's for a build brief, the ones the scenarios walk for a test brief.
      # Per box, by the same rule as the graph's box code: the functions that build it with
      # path:line and coverage, its Flow-Box commits (newest first, with branch), callers and
      # callees over exact calls edges by rank, the tests that call it; a box with no code gets
      # the top `find` matches as guesses. The rehearse command as it runs in this repo. The
      # e2e helpers of the test project. Runs no tests. Used by the build and test thread start,
      # "Send the change" and `rehearse brief`.

    - id: code-start-section
      kind: process
      lane: rehearse
      package: core
      title: Write "Code you start from"
      stories: [S15]
      inputs:  { storyId: string, scenarios: "list string?", code: "list string", cli: string, codeUnavailable: "string?" }
      outputs: { storyId: string, scenarios: "list string?", section: string }
      # One block per box in the order of the boxes section. Caps: 8 functions, 5 commits,
      # 5 callers and callees. Shorter blocks when the brief would pass its size budget. A graph
      # that is down is one line. The test brief gets the short form per scenario.

    # --- A story's design, inside rehearse, FigCraft embedded (S16, T50) ---
    # New boxes only: validate, valid, draft-record, rejected, review, happy, start-build and
    # build-brief stay as they are; root edges join them.
    - id: design-links
      kind: process
      lane: rehearse
      package: core
      title: Read and check design/links.yaml
      stories: [S16]
      inputs:  { storyId: "string?" }
      outputs: { storyId: "string?", links: "list string", findings: "list Finding", report: Report }
      reads:   [Story.*, Box.*]
      errorExits: ["bad link"]
      # design/links.yaml at the repo top, outside the signed record: per EPIC slug and story id
      # (and optionally per box path) a FigCraft file under design/, a page (number or name) and
      # the page's PNG. Pure parse and check in core; a missing story, box, file or PNG is a
      # finding that `rehearse validate` reports (the error exit), never a crash.

    - id: fetch-figcraft-web
      kind: input
      lane: builder
      package: server
      title: Fetch FigCraft's web build once, hash checked
      stories: [S16]
      inputs:  { version: "string?" }
      outputs: { version: string, dir: string }
      sideEffects: [download figcraft-web-<version>.zip and SHA256SUMS.txt from the GitHub release]
      errorExits: ["hash mismatch"]
      # `pnpm rehearse figcraft fetch [--version <v>]`, or the button on the Design tab (POST
      # /api/figcraft/fetch, token and Origin). Default version: `FigCraft --version` of the
      # desktop app, else the latest release. Unpacks into .rehearse/figcraft-web/<version>/
      # (gitignored) through a temporary folder; a hash mismatch exits 1 and changes nothing.

    - id: host-figcraft
      kind: process
      lane: rehearse
      package: server
      title: Serve hosts FigCraft web under /figcraft/, same origin
      stories: [S16]
      inputs:  { version: "string?" }
      outputs: { url: string, version: string }
      # The newest fetched version under /figcraft/: .wasm as application/wasm, .js as
      # text/javascript, a CSP `frame-ancestors 'self'` so only serve's pages frame it, no COOP or
      # COEP. Not fetched: a plain page that says so with the command.

    - id: design-tab
      kind: output
      lane: builder
      package: ui
      title: The story's Design tab, and Edit in FigCraft
      stories: [S16]
      inputs:  { storyId: "string?", links: "list string?" }
      outputs: { storyId: string, file: "string?", decision: "enum[look, edit, save, close]" }
      reads:   [Story.*, Box.*]
      errorExits: ["web build not fetched"]
      # The linked page's PNG with file and page, a box's own link in the box drawer; no link:
      # "No design linked" and the line to add to links.yaml. "Edit in FigCraft": an iframe
      # /figcraft/?host=parent&author=<owner>; on figcraft:ready it sends figcraft:open with the
      # file and says which page to open (FigCraft cannot jump there). The unsaved dot follows
      # figcraft:dirty; closing or leaving while dirty asks first; figcraft:failed in plain words.
      # A Save of the sent file goes to save-design; Save As and exports are downloads.

    - id: save-design
      kind: input
      lane: builder
      package: server
      title: Save the design back into design/
      stories: [S16]
      inputs:  { file: string, bytes: string }
      outputs: { file: string, size: number }
      sideEffects: [write design/<file>.figcraft]
      errorExits: ["file not linked"]
      # POST /api/design/save {file, bytes} (token and Origin), an owner action from the UI: no
      # CLI command writes design files, and the skill and briefs say agents never call it. Only a
      # .figcraft path under design/ of serve's checkout that links.yaml names; outside design/,
      # `..`, another extension or not linked is refused and nothing is written.

    - id: design-brief
      kind: process
      lane: rehearse
      package: core
      title: Write the "Design" section of the build brief
      stories: [S16]
      inputs:  { storyId: "string?", links: "list string" }
      outputs: { storyId: string, section: string }
      # The linked file, page and PNG of the story and its boxes; build the screen to match it,
      # read the PNG, inspect FigCraft on 127.0.0.1:4800 read-only with the figcraft-use skill if
      # at all, never write the design file. No link: "No design linked for this story." Core
      # stays pure: serve and the CLI read links.yaml; `rehearse brief --json` has it.

    - id: design-beside-result
      kind: output
      lane: builder
      package: ui
      title: The design beside the latest test result, where the owner approves and signs off
      stories: [S16]
      inputs:  { storyId: "string?" }
      outputs: { decision: "enum[approve, change]" }
      reads:   [Story.*, Scenario.*]
      # For a story with a design link: its PNG beside the latest Birdview result of the story's
      # tests as the Tests tab knows it (the screenshot, else the recording, else "no run yet").
      # Read-only; no new approval rule.

    # --- Link a story to its design without editing YAML (S17, T51) ---
    # New boxes only: design-tab, design-brief, validate, valid, draft-record and start-build stay
    # as they are; root edges join them.
    - id: design-index
      kind: process
      lane: rehearse
      package: core
      title: Index the design files under design/
      stories: [S17]
      inputs:  { storyId: "string?" }
      outputs: { storyId: "string?", files: "list string", findings: "list Finding" }
      # Every design/**/*.figcraft (a zip): its pages (number, name; page ids numbers or strings)
      # and their top-level frames (id, name). A page's picture is design/<n>-<slug>.png when it
      # exists, else the zip's thumbnail.png, marked "file thumbnail"; a frame's is
      # design/frames/<frame-slug>.png. Read again only when a file's size or mtime changes. Over
      # 64 MB or not a FigCraft zip is a finding, never a crash. Pure in core; serve and the CLI read the disk.

    - id: link-design
      kind: input
      lane: builder
      package: server
      title: Link, change or unlink a design in one click
      stories: [S17]
      inputs:  { epic: string, storyId: string, box: "string?", file: "string?", page: "number?", frame: "string?", unlink: "boolean?" }
      outputs: { storyId: string, link: "string?" }
      sideEffects: [write design/links.yaml]
      errorExits: ["file not in design/"]
      # POST /api/design/link {epic, story, box?, file, page, frame?} or {…, unlink: true}: the
      # owner's click in the picker (files → pages → frames with pictures), on a suggestion, or on
      # Change / Unlink, in the Design tab or the box drawer. Token and Origin; agents never call
      # it. The yaml document API keeps comments and order. Only an indexed .figcraft file under
      # design/, a page and a top-level frame it has; else refused and nothing written.

    - id: suggest-design
      kind: process
      lane: rehearse
      package: core
      title: Suggest pages and frames for an unlinked story or box
      stories: [S17]
      inputs:  { storyId: "string?", files: "list string" }
      outputs: { storyId: "string?", suggestions: "list string" }
      # Ranks pages and frames by word overlap with the story's want, criteria and box titles
      # (light stemming, stop words dropped, page numbers ignored, words common to every story
      # weigh less). The top 3 show as "Suggested" with the matching words as the reason and a
      # Link button; never linked by themselves. `rehearse design suggest <epic> [--json]` lists them.

    - id: frame-tag-links
      kind: process
      lane: rehearse
      package: core
      title: Frames named [<story id>] link themselves
      stories: [S17]
      inputs:  { files: "list string" }
      outputs: { storyId: "string?", links: "list string", findings: "list Finding", report: Report }
      errorExits: ["unknown story in tag"]
      # A top-level frame named `[S17] …`, `[S17/<box path>] …` or `[<epic slug>:S17] …` links that
      # story or box. A links.yaml entry wins over it; it wins over a suggestion. A tag naming a
      # story or box that does not exist, or a story id two EPICs have without the slug, is a
      # finding `rehearse validate` reports (the error exit) and links nothing.

    - id: refresh-design-pictures
      kind: input
      lane: builder
      package: server
      title: Refresh the pictures of linked frames from a running FigCraft
      stories: [S17]
      inputs:  { storyId: string }
      outputs: { storyId: string, wrote: "list string" }
      sideEffects: [write design/<n>-<slug>.png, write design/frames/<frame-slug>.png]
      errorExits: ["FigCraft not running", "file not the active tab"]
      # POST /api/design/refresh {story} (token and Origin), the owner's "Refresh pictures". Asks
      # FigCraft on 127.0.0.1:4800 for doc.list and renders each linked frame with ui.render
      # (png, base64) only when the linked file is the active tab; no other command is sent, never
      # one that changes a document. Not running: "Open the file in FigCraft (port 4800) to
      # refresh pictures". Says what it wrote.

    # --- A deck of an EPIC for a supervisor who is not technical (S18, T52) ---
    # New boxes only: review, draft-record and rejected stay as they are; root edges join them.
    - id: present-view
      kind: input
      lane: builder
      package: ui
      title: Press Present on the EPIC page
      stories: [S18]
      inputs:  { epic: string }
      outputs: { epic: string, committedOnly: "boolean?" }
      # The EPIC page's Present button opens a preview of the deck as it will be sent (the same
      # HTML in an iframe, arrow keys), with "Download HTML" and "Download PDF". GET
      # /api/present?epic=<slug>[&format=pdf] with the session token and serve's Origin.

    - id: present-cli
      kind: input
      lane: builder
      package: cli
      title: Make a deck with rehearse present
      stories: [S18]
      inputs:  { epic: string, out: "string?", pdf: "string?", committedOnly: "boolean?" }
      outputs: { epic: string, out: "string?", pdf: "string?", committedOnly: "boolean?" }
      # `pnpm rehearse present <epic> [--out <file.html>] [--pdf <file.pdf>] [--committed-only]`.
      # Default out: presentations/<slug>-<date>-<sha>.html at the git top (git ignores the
      # folder: the owner sends the file). Exit 0 written, 1 refused, 2 usage.

    - id: gather-deck-facts
      kind: process
      lane: rehearse
      package: server
      title: Gather what the deck shows from the record and the repo
      stories: [S18]
      inputs:  { epic: string, committedOnly: "boolean?" }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string }
      reads:   [Story.*, Scenario.*, Epic.*]
      errorExits: ["uncommitted changes"]
      # The branch, short sha and date of HEAD; whether the EPIC folder has uncommitted changes
      # (refused with --committed-only); Flow-Box commits reachable from HEAD; the e2e tests and
      # the last results Birdview knows; design links and their pictures; the gate; who signed.

    - id: build-deck
      kind: process
      lane: rehearse
      package: core
      title: Build the slides in plain words
      stories: [S18]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string }
      outputs: { epic: string, slides: number, deck: string }
      errorExits: ["bad presentation inputs"]
      # Pure: presentationDeck(record, facts, inputs). Slides in a fixed order, each with a key, a
      # title, narration and blocks. presentation.yaml (asks, next, risks, narration, hide) is
      # not part of the signed record; a file of the wrong shape is refused in plain words.

    - id: render-deck-html
      kind: process
      lane: rehearse
      package: core
      title: Write the deck as one self-contained HTML file
      stories: [S18]
      inputs:  { epic: string, deck: string }
      outputs: { epic: string, html: string, bytes: number }
      # Pure: deckHtml(deck, assets). Inline CSS and SVG, pictures as data URIs no wider than
      # 1600 px, no fetch; arrow keys and a counter as optional script; print CSS gives one
      # landscape slide per page.

    - id: print-deck-pdf
      kind: process
      lane: rehearse
      package: server
      title: Print the deck to PDF with Chromium
      stories: [S18]
      inputs:  { html: string }
      outputs: { html: string, pdf: string }
      errorExits: ["Chromium not available"]
      # Playwright's Chromium from the e2e package, when it can start; else the owner is told to
      # open the HTML and use the browser's "Save as PDF".

    - id: deck-file
      kind: output
      lane: builder
      package: cli
      title: The deck the owner sends
      stories: [S18]
      inputs:  { html: string, pdf: "string?" }
      outputs: { html: string, pdf: "string?" }

    # --- The deck says what is done and what is not, with the proof (S19, T53) ---
    # New boxes only: the S18 boxes stay as they are; root edges join them.
    - id: download-with-recordings
      kind: input
      lane: builder
      package: ui
      title: Download the deck with its recordings
      stories: [S19]
      inputs:  { epic: string }
      outputs: { epic: string, withRecordings: boolean }
      # The Present preview's "HTML + recordings (zip)" button: one zip with the HTML and its
      # <deck>-media/ folder.

    - id: read-saved-test-results
      kind: process
      lane: rehearse
      package: server
      title: Read the e2e results Birdview knows or saved
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, e2eResults: string }
      errorExits: ["Birdview data not found", "result does not match a test"]
      # The live player first; when it does not have this project, the results files Birdview
      # saved in its data folder. Each result is matched to a test by file:line, or by the test
      # title when the line moved; a result that matches nothing is dropped and counted.

    - id: read-unit-report
      kind: process
      lane: rehearse
      package: server
      title: Read the unit tests from a vitest report
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string, unitReport: "string?" }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, unitTests: string }
      errorExits: ["unit report missing or unreadable"]
      # The vitest JSON report given with `--unit-report <file.json>` (the CLI passes the path).
      # Tests are counted per story through the files of its built parts.

    - id: last-screen-picture
      kind: process
      lane: rehearse
      package: server
      title: Take a still of the last screen of each recording
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, pictures: string }
      # The last frame of a test's recording as a picture no wider than 1600 px, with the path of
      # the video for the link.

    - id: story-done-state
      kind: process
      lane: rehearse
      package: core
      title: Decide if each story is done, in progress or not started
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, doneStates: string }
      # Pure, one rule for the whole deck. Done: signed off and not stale, every approved
      # scenario's e2e test passed in its last run, every box has code. Not started: not signed
      # off and no box has code. Else in progress.

    - id: build-recap
      kind: process
      lane: rehearse
      package: core
      title: Build the recap slide after the title
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string, doneStates: string }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, doneStates: string, recap: string }
      # One sentence on top ("12 of 19 stories are done"), then every story and its state.

    - id: proof-lines
      kind: process
      lane: rehearse
      package: core
      title: Write a proof line per source on every story slide
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string, doneStates: string }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, proofLines: string }
      # e2e results, last screen picture, recording link, unit tests, simulation, built parts and
      # commits, signature. A missing source says it is missing.

    - id: evidence-page
      kind: process
      lane: rehearse
      package: core
      title: Say where each proof comes from
      stories: [S19]
      inputs:  { epic: string, commit: string, uncommitted: boolean, facts: string }
      outputs: { epic: string, commit: string, uncommitted: boolean, facts: string, evidence: string }
      # A page before the glossary: each source, where it was read from, and whether it was found.

    - id: copy-recordings
      kind: process
      lane: rehearse
      package: cli
      title: Copy the linked recordings next to the deck
      stories: [S19]
      inputs:  { html: string, withRecordings: "string?" }
      outputs: { html: string, media: string, copied: number }
      # `--with-recordings <dir>` copies each linked video into <deck>-media/ next to the HTML
      # and points the links there. A video that cannot be found is named as missing.

  edges:
    - { from: start,          to: new-epic }
    - { from: new-epic,       to: draft-record }
    - { from: new-epic,       to: rejected,       label: epic-exists, kind: error }
    - { from: new-epic,       to: rejected,       label: bad-slug,    kind: error }
    - { from: draft-record,   to: validate }
    - { from: validate,       to: valid }
    - { from: valid,          to: draft-record,   label: "no",  kind: branch }
    - { from: valid,          to: simulate,       label: "yes", kind: branch }
    - { from: simulate,       to: design-errors }
    - { from: design-errors,  to: log-correction, label: "yes", kind: branch }
    - { from: design-errors,  to: review,         label: "no",  kind: branch }
    - { from: log-correction, to: draft-record }
    - { from: review,         to: happy }
    - { from: happy,          to: draft-record,   label: change,  kind: branch }
    - { from: happy,          to: signing-key,    label: approve, kind: branch }
    - { from: signing-key,    to: approve,        label: "yes", kind: branch }
    - { from: signing-key,    to: no-key,         label: "no",  kind: branch }
    - { from: approve,        to: more-scenarios }
    - { from: more-scenarios, to: review,         label: "yes", kind: branch }
    - { from: more-scenarios, to: gate,           label: "no",  kind: branch }
    - { from: gate,           to: gate-ok }
    - { from: gate-ok,        to: review,         label: "no",  kind: branch }
    - { from: gate-ok,        to: sign-off,       label: "yes", kind: branch }
    - { from: sign-off,       to: signed }
    - { from: signed-edit,    to: content-changed }
    - { from: content-changed, to: review }
    - { from: pr-opened,      to: ci-run }
    - { from: ci-run,         to: ci-ok }
    - { from: ci-ok,          to: ci-pass,        label: "yes", kind: branch }
    - { from: ci-ok,          to: ci-fail,        label: "no",  kind: branch }
    - { from: sign-off,        to: watch-build }
    - { from: content-changed, to: watch-build }
    - { from: watch-build,     to: start-build }
    - { from: watch-build,     to: review,      label: "story not signed or stale", kind: error }
    - { from: start-build,     to: build-brief }
    - { from: build-brief,     to: watch-build }
    - { from: review,          to: story-playlist }
    - { from: story-playlist,  to: play-story }
    - { from: story-playlist,  to: use-project }
    - { from: story-playlist,  to: review }
    - { from: play-story,      to: story-playlist }
    - { from: play-story,      to: story-playlist, label: "Birdview busy",        kind: error }
    - { from: play-story,      to: story-playlist, label: "Birdview not running", kind: error }
    - { from: use-project,     to: story-playlist }
    - { from: use-project,     to: story-playlist, label: "Birdview busy",        kind: error }
    - { from: draft-record,    to: play-cli }
    - { from: play-cli,        to: play-story }
    - { from: story-playlist,    to: test-rows }
    - { from: test-rows,         to: story-playlist }
    - { from: test-rows,         to: start-test-thread }
    - { from: start-test-thread, to: test-brief }
    - { from: start-test-thread, to: test-rows,   label: "scenario not approved", kind: error }
    - { from: test-brief,        to: test-rows }
    - { from: draft-record,      to: test-brief-cli }
    - { from: test-brief-cli,    to: test-brief }
    - { from: watch-build,     to: merge-panel }
    - { from: test-rows,       to: merge-panel }
    - { from: merge-panel,     to: thread-branch }
    - { from: thread-branch,   to: merge-panel }
    - { from: thread-branch,   to: merge-panel,  label: "nothing new",          kind: error }
    - { from: merge-panel,     to: merge-thread }
    - { from: merge-thread,    to: merge-panel }
    - { from: merge-thread,    to: merge-panel,  label: "uncommitted changes",  kind: error }
    - { from: merge-thread,    to: merge-panel,  label: "merge conflict",       kind: error }
    - { from: merge-thread,    to: merge-panel,  label: "thread still working", kind: error }
    - { from: merge-panel,     to: story-playlist }
    - { from: build-brief,     to: work-rules }
    - { from: test-brief,      to: work-rules }
    - { from: work-rules,      to: merge-panel }
    - { from: draft-record,    to: play-wait }
    - { from: play-wait,       to: play-story }
    - { from: start-build,        to: gather-box-code }
    - { from: start-test-thread,  to: gather-box-code }
    - { from: test-brief-cli,     to: gather-box-code }
    - { from: gather-box-code,    to: code-start-section }
    - { from: gather-box-code,    to: code-start-section, label: "graph not available", kind: error }
    - { from: code-start-section, to: build-brief }
    - { from: code-start-section, to: test-brief }
    - { from: validate,             to: design-links }
    - { from: design-links,         to: valid }
    - { from: design-links,         to: draft-record,         label: "bad link", kind: error }
    - { from: review,               to: design-links }
    - { from: design-links,         to: design-tab }
    - { from: design-links,         to: design-beside-result }
    - { from: design-beside-result, to: happy }
    - { from: design-tab,           to: host-figcraft }
    - { from: host-figcraft,        to: design-tab }
    - { from: design-tab,           to: fetch-figcraft-web,   label: "web build not fetched", kind: error }
    - { from: draft-record,         to: fetch-figcraft-web }
    - { from: fetch-figcraft-web,   to: host-figcraft }
    - { from: fetch-figcraft-web,   to: rejected,             label: "hash mismatch", kind: error }
    - { from: design-tab,           to: save-design }
    - { from: save-design,          to: design-tab }
    - { from: save-design,          to: design-tab,           label: "file not linked", kind: error }
    - { from: start-build,          to: design-links }
    - { from: design-links,         to: design-brief }
    - { from: design-brief,         to: build-brief }
    - { from: design-tab,              to: design-index }
    - { from: design-index,            to: design-tab }
    - { from: design-index,            to: link-design }
    - { from: link-design,             to: design-tab }
    - { from: link-design,             to: design-tab,       label: "file not in design/", kind: error }
    - { from: design-index,            to: suggest-design }
