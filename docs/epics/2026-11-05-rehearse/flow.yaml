# rehearse v1 — flow (to-be). As-is is empty: this is a new product. (D4)
# Status: draft.
# Box contract (D10): inputs, outputs, reads, writes, sideEffects, errorExits,
# stories, lane. Each error exit is an edge with kind: error.
# Each box names the package that builds it (`package:`, C36) and may name the
# decisions behind it (`decisions:`, C37). A box gets its code from `Flow-Box:`
# commit trailers only (D44).

version: 1
epic: 2026-11-05-rehearse
# Every box has these fields as inputs without declaring them. (C14)
context: { epicDir: string }

lanes:
  - { role: builder, order: 1 }
  - { role: agent,   order: 2 }
  - { role: rehearse, order: 3 }   # the tool itself (system)
  - { role: ci,      order: 4 }   # an external CI service, not rehearse (C36)

root:
  boxes:
    - id: start
      kind: start
      lane: builder
      package: cli
      title: Builder has an idea

    - id: new-epic
      kind: input
      lane: builder
      package: cli
      title: Create EPIC record
      stories: [S1]
      inputs:  { slug: string, title: string }
      outputs: { epicDir: string }
      writes:  [Epic.slug, Epic.title, "Epic.status:->draft"]
      sideEffects: [creates docs/epics/<slug>/ with the smallest valid record]
      errorExits: [epic-exists, bad-slug]
      # A missing or empty title is a usage error (exit 2), not an error exit. (C20)

    - id: rejected
      kind: end
      lane: builder
      package: cli
      title: Command fails, no file changed

    - id: draft-record
      kind: process
      lane: agent
      package: cli
      title: Draft or fix record files
      stories: [S2]
      inputs:  { epicDir: string, findings: "list Finding?" }
      outputs: { epicDir: string }
      # Agents draft story text only. Story.status and Story.signedHash belong to builder and rehearse. (C16)
      writes:  [Requirement.*, Story.role, Story.want, Story.soThat, Story.requirements, Story.acceptance,
                Box.*, Example.*, "Scenario.status:->draft"]
      sideEffects: [edits YAML files in the EPIC folder]

    - id: validate
      kind: process
      lane: rehearse
      package: core
      title: Validate record
      stories: [S2]
      inputs:  { epicDir: string }
      outputs: { report: Report }
      reads:   [Epic.*, Requirement.*, Story.*, Box.*, Scenario.*]
      children:
        boxes:
          - { id: parse,       kind: process,  lane: rehearse, package: core, title: Parse YAML files,
              inputs: { epicDir: string }, outputs: { docs: map }, errorExits: [yaml-syntax] }
          - { id: schema,      kind: process,  lane: rehearse, package: core, title: Check JSON Schema,
              inputs: { docs: map }, outputs: { docs: map, findings: list Finding } }
          - { id: refs,        kind: process,  lane: rehearse, package: core, title: Check cross-file references,
              inputs: { docs: map }, outputs: { findings: list Finding } }
          - { id: report,      kind: output,   lane: rehearse, package: core, title: Write validation report,
              inputs: { findings: list Finding }, outputs: { report: Report } }
        edges:
          - { from: parse,  to: schema }
          - { from: parse,  to: report, label: yaml-syntax, kind: error }
          - { from: schema, to: refs }
          - { from: refs,   to: report }

    - id: valid
      kind: decision
      lane: rehearse
      package: core
      title: Record valid?
      inputs: { report: Report }

    - id: simulate
      kind: process
      lane: rehearse
      package: core
      title: Simulate approved scenarios
      stories: [S3, S7]
      inputs:  { epicDir: string }
      outputs: { report: Report }
      reads:   [Box.*, Example.*, Scenario.*, Story.acceptance, Requirement.*]
      children:
        boxes:
          - { id: load,        kind: process, lane: rehearse, package: core, title: Load approved scenarios (skip stale and draft),
              inputs: { epicDir: string }, outputs: { scenarios: list Scenario }, reads: [Scenario.status, Approval.hash] }
          - { id: contracts,   kind: process, lane: rehearse, package: core, title: Chain examples and check data shapes,
              inputs: { scenarios: list Scenario }, outputs: { scenarios: list Scenario, findings: list Finding } }
          - { id: coverage,    kind: process, lane: rehearse, package: core, title: Find branches and error exits that no scenario reaches,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { scenarios: list Scenario, findings: list Finding } }
          - { id: lifecycles,  kind: process, lane: rehearse, package: core, title: Check transitions and reachable states,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { scenarios: list Scenario, findings: list Finding }, reads: [Box.writes] }
          - { id: acceptance,  kind: process, lane: rehearse, package: core, title: Compare end states with acceptance criteria,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { scenarios: list Scenario, findings: list Finding }, reads: [AcceptanceCriterion.expectedState] }
          - { id: permissions, kind: process, lane: rehearse, package: core, title: Build permission matrix,
              inputs: { scenarios: list Scenario, findings: list Finding }, outputs: { findings: list Finding, matrix: map }, reads: [Lane.role, Box.reads, Box.writes] }
          - { id: report,      kind: output,  lane: rehearse, package: core, title: "Write sorted, deterministic report",
              inputs: { findings: list Finding, matrix: map }, outputs: { report: Report } }
        edges:
          - { from: load,        to: contracts }
          - { from: contracts,   to: coverage }
          - { from: coverage,    to: lifecycles }
          - { from: lifecycles,  to: acceptance }
          - { from: acceptance,  to: permissions }
          - { from: permissions, to: report }

    - id: design-errors
      kind: decision
      lane: rehearse
      package: core
      title: Design errors found?
      inputs: { report: Report }

    - id: log-correction
      kind: process
      lane: agent
      package: cli
      title: Log correction (caught-in-simulation)
      stories: [S8]
      inputs:  { report: Report }
      outputs: { correction: Correction }
      writes:  [Correction.*]
      sideEffects: [appends to corrections.md]

    - id: review
      kind: output
      lane: builder
      package: ui
      title: Review in panel
      stories: [S4, S5, S6, S7, S8]   # S6: the builder reviews each scenario before approving it (C30, C39)
      decisions: [D42]
      inputs:  { epicDir: string, report: "Report?" }
      outputs: { decision: "enum[approve, change]" }
      reads:   [Box.*, Scenario.*, Report.permissionMatrix, Correction.tag]
      children:
        boxes:
          - { id: swimlanes,   kind: output, lane: builder, package: ui, title: Swimlanes,
              inputs: { epicDir: string }, outputs: { view: "enum[bigpicture, drawer]" }, reads: [Box.*, Lane.*] }
          # playback is an input box: the builder's click gives scenarioId and step. (C15)
          # It lives on the scenario storyboard: a flowchart in role lanes, laid out by hand
          # (the path is one chain), and a step detail panel. (C41)
          - { id: playback,    kind: input,  lane: builder, package: ui, title: Play a scenario step by step,
              inputs: { scenarioId: string, step: number }, outputs: { highlighted: string }, reads: [Scenario.*, Example.*] }
          - { id: matrix,      kind: output, lane: builder, package: ui, title: Use case diagram (permissions),
              inputs: { epicDir: string }, outputs: { cells: "list string" }, reads: [Report.permissionMatrix] }
          - { id: readiness,   kind: output, lane: builder, package: ui, title: Readiness chain and correction counts,
              inputs: { epicDir: string }, outputs: { decision: "enum[approve, change]" }, reads: [Requirement.*, Story.*, Scenario.status, Approval.sig, Correction.tag] }   # C28: only a valid signature is proof
          # The S4 steps (C35): drill-down, big picture, story view and its Tests tab.
          - { id: drill,       kind: input,  lane: builder, package: ui, title: Open a box in the drawer; drill into its children,
              inputs: { click: string }, outputs: { shown: string, breadcrumb: "list string", edges: "list string" }, reads: [Box.*] }
          - { id: big-picture, kind: output, lane: builder, package: ui, title: "Big picture: every role, the main processes, one line per story",
              inputs: { epicDir: string }, outputs: { lines: "list string", shared: map }, reads: [Story.*, Box.stories, Lane.*] }
          - { id: story-view,  kind: input,  lane: builder, package: ui, title: "Story view: what, how, output, and the story thread",
              inputs: { story: string }, outputs: { panels: "list string" }, reads: [Story.*, AcceptanceCriterion.*, Box.*] }
          - { id: story-tests, kind: input,  lane: builder, package: ui, title: "Tests tab: test status in words, Birdview player",
              inputs: { story: string }, outputs: { tests: "list string" }, reads: [Scenario.*] }
        edges:
          - { from: swimlanes,   to: drill }
          - { from: swimlanes,   to: big-picture }
          - { from: swimlanes,   to: story-view }
          - { from: story-view,  to: story-tests }
          - { from: drill,       to: playback }
          - { from: big-picture, to: playback }
          - { from: story-tests, to: playback }
          - { from: swimlanes, to: playback }
          - { from: playback,  to: matrix }
          - { from: matrix,    to: readiness }

    - id: happy
      kind: decision
      lane: builder
      package: ui
      title: Design correct?
      stories: [S6]   # its approve branch starts the approval (C39)
      inputs: { decision: "enum[approve, change]" }

    - id: signing-key
      kind: decision
      lane: builder
      package: server
      title: Signing key?
      stories: [S6]
      decisions: [D41]
      inputs: { signingKey: "string?" }   # git config user.signingkey (C36)

    - id: no-key
      kind: end
      lane: builder
      package: ui
      title: Approve stays off, the signing guide is shown (C29)

    - id: approve
      kind: input
      lane: builder
      package: server
      title: Approve scenarios (UI button only)
      stories: [S6]
      decisions: [D41]
      inputs:  { scenarioIds: list string }
      outputs: { approvals: list Approval }
      writes:  ["Scenario.status:draft->approved", "Scenario.status:stale->approved", Approval.*]
      # No error exit: the CLI has no approve command (R13).
      # The UI shows a storyboard card per scenario and turns Approve on only after
      # every step was seen (C30). That is a review aid kept in the browser, not a trust control.

    - id: more-scenarios
      kind: decision
      lane: builder
      package: ui
      title: More scenarios to approve?
      stories: [S6]
      inputs: { approvals: list Approval }

    - id: gate
      kind: process
      lane: rehearse
      package: core
      title: Gate check
      stories: [S6, S9]   # S6: the gate counts only signed approvals as evidence (R13, D41)
      inputs:  { epicDir: string }
      outputs: { report: Report }
      reads:   [Requirement.*, Story.*, Scenario.status, Report.findings]
      children:
        boxes:
          - { id: traced,     kind: process, lane: rehearse, package: core, title: "Every requirement has a story, and every story has an approved scenario",
              inputs: { epicDir: string }, outputs: { findings: list Finding }, reads: [Requirement.*, Story.*, Scenario.status] }
          - { id: sim-clean,  kind: process, lane: rehearse, package: core, title: Simulation has no findings,
              inputs: { findings: list Finding }, outputs: { findings: list Finding }, reads: [Report.findings] }
          - { id: no-stale,   kind: process, lane: rehearse, package: core, title: No stale scenario,
              inputs: { findings: list Finding }, outputs: { findings: list Finding }, reads: [Scenario.status, Story.status] }
          - { id: report,     kind: output,  lane: rehearse, package: core, title: Gate report,
              inputs: { findings: list Finding }, outputs: { report: Report } }
        edges:
          - { from: traced,    to: sim-clean }
          - { from: sim-clean, to: no-stale }
          - { from: no-stale,  to: report }

    - id: gate-ok
      kind: decision
      lane: rehearse
      package: core
      title: Gate passes?
      stories: [S6, S9]   # S6-approve passes it on the "no" branch (C39)
      inputs: { report: Report }

    - id: sign-off
      kind: input
      lane: builder
      package: server
      title: Sign off (UI button only)
      stories: [S9]
      decisions: [D17, D41]
      inputs:  { storyIds: list string }
      outputs: { signOff: SignOff }
      writes:  ["Story.status:draft->signed", "Story.status:stale->signed",
                "Epic.status:draft->signed", "Epic.status:partly-stale->signed", SignOff.*]
      # No error exit: the CLI has no sign-off command (R14).
      # Before the button, GET /api/sign-off/preview shows per story what the hash covers and
      # what changed since its last sign-off (from git; read only, never blocks). (C42, S9-A4)

    - id: signed
      kind: end
      lane: builder
      package: server
      title: EPIC signed — build may start

    - id: signed-edit
      kind: start
      lane: agent
      package: cli
      title: Someone edits signed content

    - id: content-changed
      kind: process
      lane: rehearse
      package: core
      title: Detect changed signed content
      stories: [S6, S9]
      decisions: [D23]
      inputs:  { epicDir: string }
      outputs: { staleStories: list string, staleScenarios: list string }
      reads:   [Story.signedHash, Approval.hash]
      writes:  ["Story.status:signed->stale", "Scenario.status:approved->stale",
                "Epic.status:signed->partly-stale"]

    - id: pr-opened
      kind: start
      lane: ci
      package: cli
      title: PR opened or updated

    - id: ci-run
      kind: external
      lane: ci
      package: cli
      title: CI runs validate, simulate, gate --json
      stories: [S10]
      inputs:  { epicDir: string }
      outputs: { exitCode: number, report: Report }
      # CI reads the record and writes nothing (C36).
      reads:   [Epic.*, Requirement.*, Story.*, Box.*, Scenario.*, Approval.*, SignOff.*]
      writes:  []
      sideEffects: [runs the same core library as validate, simulate and gate]

    - id: ci-ok
      kind: decision
      lane: ci
      package: cli
      title: Exit code 0?
      inputs: { exitCode: number }

    - id: ci-pass
      kind: end
      lane: ci
      package: cli
      title: PR may merge

    - id: ci-fail
      kind: end
      lane: ci
      package: cli
      title: PR blocked, report attached

    # --- Hand a signed story to a bb thread, and watch its work (S11, T44) ---
    # New boxes only: sign-off, content-changed and review stay as they are; root edges join them.
    - id: watch-build
      kind: output
      lane: builder
      package: ui
      title: The story's build panel - Build button, plan-changed notice and progress
      stories: [S11]
      inputs:  { epicDir: string }
      outputs: { storyId: string, decision: "enum[build, send-change, ask]" }
      reads:   [Story.*, Box.*, Scenario.*, SignOff.*]
      errorExits: ["story not signed or stale"]
      # Signed and not stale: "Build with an agent". Unsigned or stale: why, and "Start a question
      # thread" (the error exit). A build link whose plan hash differs from now: "the plan changed
      # since this thread started" and "Send the change". The progress block, above the messages:
      # thread status and last activity; per box built or not yet, commits, branch, coverage; per
      # approved scenario its e2e test found, passing, failing or missing ("not run yet"); gate
      # findings and whether the sign-off holds; "N of M boxes have code · K of L scenarios tested".
      # GET /api/story-progress[?story=] reads git, the bb thread, the playlist and the graph;
      # without ?story= it gives the overview column of the Stories list. `rehearse progress` prints it.

    - id: start-build
      kind: input
      lane: builder
      package: server
      title: Start a build thread, or send it the change
      stories: [S11]
      inputs:  { storyId: string }
      outputs: { storyId: string, thread: string, hash: hash, at: datetime }
      reads:   [Story.*, SignOff.*]
      sideEffects: [bb thread spawn --new-environment worktree --base-branch <current>, bb thread tell]
      # POST /api/story-thread/build (token and Origin) checks the story again: 409 when unsigned or
      # stale. --model and --reasoning-level only when the serve options or the plugin settings set
      # them. The link file keeps the thread, the hash and the time. POST /api/story-thread/send-change
      # tells the thread what changed, before and now. Never an approve or sign-off.

    - id: build-brief
      kind: process
      lane: rehearse
      package: core
      title: Make the build brief of a signed story
      stories: [S11]
      inputs:  { storyId: string }
      outputs: { brief: string, hash: hash }
      reads:   [Story.*, Requirement.*, AcceptanceCriterion.*, Scenario.*, Box.*, SignOff.*]
      # Header (signed by, at, rule-2 hash, matches), story, requirements and criteria, approved
      # scenarios (given / when / then, expect; drafts apart), serving boxes with contracts,
      # children and edges, decisions, entities, and how to work (the same lines as the skill).
      # Under about 6k tokens. `rehearse brief <epic> <story>` prints it; it refuses a stale or
      # unsigned story unless --allow-unsigned.

    # --- Play a story's e2e tests in Birdview with one button (S12, T45) ---
    # New boxes only: review, story-tests and playback stay as they are; root edges join them.
    - id: story-playlist
      kind: output
      lane: builder
      package: ui
      title: Story playlist and Play in Birdview
      stories: [S12]
      inputs:  { storyId: string }
      outputs: { storyId: string, decision: "enum[play, play-test, switch-back]", test: "string?", to: "enum[this, default]?" }
      reads:   [Story.*, Scenario.*]
      # GET /api/birdview?story= builds the playlist from the record and the spec files (as
      # `rehearse playlists`), and reads the player's project, playlist and default project.
      # "Birdview: <project> · playlist <name>"; on another project "Birdview is on <it>. Play will
      # switch it to this repo." and "Switch back". A ▶ per test. Busy and not running in words.

    - id: play-story
      kind: input
      lane: builder
      package: server
      title: Play the story in Birdview
      stories: [S12]
      inputs:  { storyId: string, test: "string?" }
      outputs: { storyId: string, project: string, playlist: string, played: "list string" }
      sideEffects: [Birdview POST /api/project, Birdview POST /api/playlist, Birdview POST /api/play]
      errorExits: ["Birdview busy", "Birdview not running"]
      # POST /api/birdview/play-story and /play-test (token and Origin). One try: 409 is "Birdview
      # is busy, try again", no answer is "Birdview is not running; open it from the bb sidebar".

    - id: use-project
      kind: input
      lane: builder
      package: server
      title: Switch Birdview back
      stories: [S12]
      inputs:  { storyId: string, to: "enum[this, default]" }
      outputs: { storyId: string, project: string }
      sideEffects: [Birdview GET /api/projects, Birdview POST /api/project]
      errorExits: ["Birdview busy"]
      # POST /api/birdview/use-project (token and Origin). The default is the player's projectDir setting.

    - id: play-cli
      kind: input
      lane: agent
      package: cli
      title: rehearse play and playlists --push
      stories: [S12]
      inputs:  { story: string, test: "string?" }
      outputs: { storyId: string, test: "string?", exitCode: number }
      # The same calls as the Tests tab; exit 1 when busy or not running, 2 on a bad argument.

    # --- Hand a scenario without an e2e test to an agent (S13, T47) ---
    # New boxes only: story-playlist, start-build and build-brief stay as they are; root edges join them.
    - id: test-rows
      kind: output
      lane: builder
      package: ui
      title: No-test rows and the story's test thread on the Tests tab
      stories: [S13]
      inputs:  { storyId: string }
      outputs: { storyId: string, decision: "enum[write-one, write-missing, send]", scenarios: "list string" }
      reads:   [Story.*, Scenario.status]
      # A no-test row of an approved scenario: "Write this test with an agent". A draft or stale
      # one: "approve this scenario first", no button. The summary: "Write the K missing tests with
      # an agent" (one thread). The rows of the test thread: status words, last activity, @thread;
      # then "test written, not run yet". While it works, the buttons send to it instead.

    - id: start-test-thread
      kind: input
      lane: builder
      package: server
      title: Start the story's test thread, or send it more scenarios
      stories: [S13]
      inputs:  { storyId: string, scenarios: "list string?" }
      outputs: { storyId: string, thread: string, scenarios: "list string", hash: hash, at: datetime }
      reads:   [Story.*, Scenario.status]
      sideEffects: [bb thread spawn --new-environment worktree --base-branch <current>, bb thread tell]
      errorExits: ["scenario not approved"]
      # POST /api/story-tests/thread and /send (token and Origin). Title "Tests: <story> <ids>".
      # One test thread per story at a time: a second start while it works is 409, send instead.
      # The link goes in .rehearse/story-threads.json as the story's `tests` entry.

    - id: test-brief
      kind: process
      lane: rehearse
      package: core
      title: Make the test brief of approved scenarios
      stories: [S13]
      inputs:  { storyId: string, scenarios: "list string" }
      outputs: { storyId: string, brief: string, specFile: string, hash: hash }
      reads:   [Story.*, AcceptanceCriterion.*, Scenario.*, Box.*]
      # Story sentence; per scenario the criterion, steps with their boxes, examples and expect;
      # the spec file and the test name (the Tests tab's rule, quoted); an example spec; how to
      # run it; write only tests; how to work. Refuses a draft or stale scenario.

    - id: test-brief-cli
      kind: input
      lane: agent
      package: cli
      title: rehearse brief --tests
      stories: [S13]
      inputs:  { story: string, scenarios: "list string?" }
      outputs: { storyId: string, scenarios: "list string", brief: string, exitCode: number }
      # Default: the approved scenarios without a test. Exit 1 on a draft or stale scenario or
      # none missing, 2 on a bad argument.

    # --- Agent threads land their work through the owner (S14, T48) ---
    # New boxes only: watch-build, test-rows, play-story, build-brief and test-brief stay as they
    # are; root edges join them.
    - id: thread-branch
      kind: process
      lane: rehearse
      package: server
      title: What the thread's branch has that the current branch has not
      stories: [S14]
      inputs:  { storyId: string, kind: "enum[build, tests]" }
      outputs: { storyId: string, branch: string, current: string, commits: "list string", files: "list string", scenarios: "list string" }
      reads:   [Story.*, Scenario.*]
      errorExits: ["nothing new"]
      # The branch from `bb thread show --json` (environment.branchName); the commits are
      # `git log <current>..<branch>`, the files `git diff --name-only <current>...<branch>`; for a
      # test thread, the scenario rows its new tests fill. GET /api/thread/merge (token and Origin).

    - id: merge-panel
      kind: output
      lane: builder
      package: ui
      title: The merge summary, Merge into <current branch>, and play after a test merge
      stories: [S14]
      inputs:  { storyId: string }
      outputs: { storyId: string, kind: "enum[build, tests]", decision: "enum[merge, ask-rebase, play]" }
      reads:   [Story.*, Scenario.*]
      # On the story's thread panel (build) and its Tests tab (tests): "N commits in the thread, not
      # in <current> yet", the subjects and files, the rows they fill; "Merge into <current>" with a
      # confirm; a refusal in plain words; after a test merge "Play the new tests in Birdview".

    - id: merge-thread
      kind: input
      lane: builder
      package: server
      title: Merge the thread's branch into serve's checkout
      stories: [S14]
      inputs:  { storyId: string, kind: "enum[build, tests]" }
      outputs: { storyId: string, merged: string, commits: number, files: "list string", scenarios: "list string" }
      reads:   [Story.*]
      sideEffects: [git merge --no-ff <branch>, git merge --abort, bb thread tell (ask to rebase)]
      errorExits: ["uncommitted changes", "merge conflict", "thread still working"]
      # POST /api/thread/merge {story, kind} (token and Origin), an owner action: no CLI command,
      # and the briefs say agents never call it. Message "Merge <thread title>" and the repo's
      # Co-Authored-By line. Every refusal leaves HEAD, the index and the files as they were.

    - id: work-rules
      kind: process
      lane: rehearse
      package: core
      title: How an agent lands its work, sets up and runs e2e tests, in every brief
      stories: [S14]
      inputs:  { brief: string }
      outputs: { storyId: string, lines: "list string", whereShown: "list string", fixture: string }
      reads:   [Box.*, Scenario.*]
      # One "how to work" source for the build brief, the test brief and the skill: commit on the
      # thread's branch and stop, set up first, play e2e tests with `pnpm rehearse play … --wait`.
      # The test brief adds, per scenario, where each expected result shows and the fixture.

    - id: play-wait
      kind: input
      lane: agent
      package: cli
      title: pnpm rehearse play --wait
      stories: [S14]
      inputs:  { story: string, test: "string?", timeout: "number?" }
      outputs: { storyId: string, results: "list string", exitCode: number }
      # The root script `pnpm rehearse` runs packages/cli/bin/rehearse.js. --wait waits for the
      # run to end in Birdview and prints passed / failed (with the failed step): exit 0 / 1;
      # no result before --timeout exits 1; a bad argument exits 2.

  edges:
    - { from: start,          to: new-epic }
    - { from: new-epic,       to: draft-record }
