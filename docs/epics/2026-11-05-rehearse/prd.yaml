# rehearse — EPIC (PRD), version 1
# Status: signed (bootstrap). See signoff.yaml.
# Why: see brainstorm.md (decision IDs D1…D46).

epic:
  slug: 2026-11-05-rehearse
  title: rehearse v1 — simulate a product change before you build it
  goal: >-
    A builder who works with AI agents can model a change, simulate it with
    plain code, and see why it is ready, before any agent writes code.
  successMeasure: >-
    Most design errors in corrections.md have the tag caught-in-simulation,
    not caught-after-build. (D34)
  outOfScope:
    - Wireframe playback and the Playwright/Vitest adapter (with Birdview).
    - Linear sync.
    - Child-thread orchestration (task briefs, worktrees).
    - Code pull for the as-is system map, and the AST view.
    - FigCraft links and .figcraft file format research.
    - Finalize and docs/system/ merge.

roles:
  - id: builder
    name: Builder
    kind: human
    about: The owner. Approves scenarios, reviews the flow, signs off the gate.
  - id: agent
    name: Agent
    kind: agent
    about: An AI agent. Writes drafts of record files. Never approves or signs off.
  - id: ci
    name: CI
    kind: external
    about: A headless run in a pipeline, outside rehearse. Runs checks only. (C36)
  - id: rehearse
    name: rehearse
    kind: system
    about: The tool itself. Validates, simulates, detects stale content.

requirements:
  # --- Record and schema ---
  - id: R1
    kind: functional
    text: >-
      The CLI creates an EPIC folder with the smallest valid record: one role
      and its lane, a start box and an end box, and empty lists. (D28, C18)
  - id: R2
    kind: functional
    text: >-
      A JSON Schema validates prd.yaml, entities.yaml, flow.yaml and each
      scenario file. Errors show the file, the path in the file, and the reason.
  - id: R3
    kind: functional
    text: >-
      The validator checks references across files: story → requirement,
      box → story, box → role (lane), state access → entity field,
      scenario → story and box path. It also checks flow structure: a start
      box has no incoming edges, an end box has no outgoing edges, each root
      box is reachable from a start and reaches an end, a decision has 2 or
      more labeled branches, and an error exit has an edge that does not loop
      to its own box. (corrections C1–C5)
  # --- Simulation ---
  - id: R4
    kind: functional
    text: >-
      The simulator chains the given/when/then examples along each scenario
      path. It reports an output that does not fit the input shape of the next
      box. (D10, D15)
  - id: R5
    kind: functional
    text: >-
      The simulator reports each decision branch and each error exit that no
      approved scenario reaches.
  - id: R6
    kind: functional
    text: >-
      The simulator reports each state change that the entity lifecycle does
      not permit, each lifecycle state that no box can reach, and each
      transition made by a box whose lane role is not the `by` role of that
      transition. (D21, C17)
  - id: R7
    kind: functional
    text: >-
      The simulator compares the end state of each scenario with the
      acceptance criteria of its story, and reports each difference.
  - id: R8
    kind: functional
    text: >-
      The tool makes a permission matrix (role × entity × action) from lanes
      and state access. The UI shows it as a use case diagram: roles → actions
      → data. (D22, D42)
  # --- Visual ---
  - id: R9
    kind: functional
    text: >-
      The panel shows the flow in swimlanes, one lane per role or external
      system. A box opens in a drawer over the current page; a box with
      children shows its steps there as a nested diagram. (D13, D32, C41)
  - id: R10
    kind: functional
    text: >-
      The storyboard of a scenario plays it step by step. It highlights the current box
      and shows its input, output and state change.
  - id: R11
    kind: functional
    text: >-
      The readiness view shows the chain requirement → story → box → scenario
      → result, and flags requirements with no proof and boxes with no
      requirement. Start, end and decision boxes are not in the list "no
      requirement". Only a scenario approved with a valid signature is
      proof; an unsigned approval shows "approval not signed". (D11, C24, C28)
  - id: R12
    kind: functional
    text: >-
      `rehearse serve` serves one UI. The bb panel and a full-screen browser
      tab show the same UI. (D31)
  # --- Gate and trust ---
  - id: R13
    kind: functional
    text: >-
      The builder approves each scenario with a button in the rehearse UI.
      The CLI has no approve command, so an agent cannot approve. The record
      keeps who approved it (git user.email, plus the bb thread ID when one
      is set), when, a hash of the approved content, and an SSH signature
      by the builder's key. An approval with no valid signature from a key
      in .rehearse/allowed_signers is not evidence. (D41)
  - id: R14
    kind: functional
    text: >-
      The gate passes only when all gate checks pass. The builder then signs
      off with a button in the rehearse UI. The CLI has no sign-off command.
      The record keeps who signed off (same identity as R13), when, a hash
      of each signed story, and an SSH signature as in R13. (D17, D41)
  - id: R15
    kind: functional
    text: >-
      When signed content changes, the tool marks the affected stories,
      boxes and scenarios stale. The builder signs off again for the
      affected stories only. (D23)
  - id: R16
    kind: functional
    text: >-
      corrections.md entries have a tag caught-in-simulation or
      caught-after-build. The readiness view shows the count of each tag. (D34)
  # --- Non-functional ---
  - id: R17
    kind: performance
    text: >-
      validate and simulate finish in less than 2 seconds for an EPIC with
      200 boxes and 100 scenarios, on a developer laptop.
    provenBy: benchmark check on a generated fixture
  - id: R18
    kind: functional
    text: >-
      The simulator is deterministic. It uses no LLM and no network. The same
      record always gives the same report. (D15)
  - id: R19
    kind: functional
    text: >-
      validate, simulate and gate check run headless with exit codes and a
      --json report, without bb. (D26)
  - id: R20
    kind: security
    text: >-
      `rehearse serve` listens on 127.0.0.1 only. Remote access goes through
      `bb connect expose`.
    provenBy: unit check of the listen address
  - id: R21
    kind: functional
    text: >-
      Scenario steps use box paths as names (for example checkout/pay/charge).
      (D39)

  - id: R22
    kind: functional
    text: >-
      A signed story can be handed to a bb thread as a build brief: the story, its
      approved scenarios, its boxes and how to work in a rehearse repo. The thread
      works in its own worktree, and rehearse shows its progress per box and per
      scenario. A stale or unsigned story is not handed over. (T44)

  - id: R23
    kind: functional
    text: >-
      The story Tests tab and `rehearse play` play a story's e2e tests in Birdview with one
      action: switch the player to this repo's test project, write the story playlist through
      it, and play it (or one test). A busy or stopped player is said in plain words; nothing
      is queued or retried, and the player can be switched back to its default project. (T45)

  - id: R24
    kind: functional
    text: >-
      A story's approved scenario with no e2e test can be handed to a coding agent from the
      Tests tab: one bb thread per story at a time gets a test brief (the scenarios, their boxes,
      where the test goes and its name, how to run it, write only tests), the rows show that
      thread, and more scenarios go to the running thread instead of a second one. A draft or
      stale scenario is approved first. `rehearse brief --tests` prints the same brief. (T47)

  - id: R25
    kind: functional
    text: >-
      An agent thread lands its work through the owner: it commits on its own branch and stops,
      and the owner merges it from rehearse with "Merge into <current branch>" after a summary of
      the commits, files and (for tests) the scenario rows they fill. rehearse refuses in plain
      words, changing nothing, when the checkout has uncommitted changes in files the merge
      touches, the merge conflicts (it aborts and offers to ask the thread to rebase), the thread
      is still working, or the branch has nothing new. The briefs say how work lands, how to set
      up the worktree, and how to run e2e tests through Birdview (`pnpm rehearse play … --wait`),
      and name the e2e fixtures to start from. (T48)

  - id: R26
    kind: functional
    text: >-
      The build brief has a section "Code you start from": per box of the story, from the code
      graph, the functions that already build it with path:line and coverage, its earlier
      Flow-Box commits, its main callers and callees, the tests that call it, and the rehearse
      commands to dig deeper; a box with no code gets the nearest code, marked as guesses. The
      test brief has the code of the boxes each scenario walks and the e2e helpers. A graph that
      is down is said in one line and the brief still builds; gathering runs no tests. (T49)

  - id: R27
    kind: functional
    text: >-
      A story, and optionally a box of it, links to a page of a FigCraft design in
      `design/links.yaml`, outside the signed record; `rehearse validate` reports a bad link as a
      finding. `rehearse figcraft fetch` downloads FigCraft's web build once, checks its SHA-256
      against the release's SHA256SUMS.txt and unpacks it under `.rehearse/` (a mismatch changes
      nothing); serve hosts it under `/figcraft/` on its own origin. The story page has a Design
      tab with the page's picture, and "Edit in FigCraft" opens the file in the embedded editor;
      the owner's Save writes back only to a linked `.figcraft` file under `design/`. The build
      brief names the design to build to, and the sign-off view shows the design beside the
      latest test result. Only the owner saves designs, from the UI. (T50)

  - id: R28
    kind: functional
    text: >-
      The owner links a story, or a box of it, to a design without editing YAML. Rehearse indexes
      every `design/**/*.figcraft` (pages and their top-level frames, with pictures); the Design
      tab and the box drawer pick a file, page and frame in one click, change or unlink it, and
      rewrite `design/links.yaml` keeping its comments and order, pointing only at indexed files
      under `design/`. An unlinked story or box gets the top 3 pages and frames whose names share
      words with it, with the reason, never linked by themselves (`rehearse design suggest` lists
      them too). A frame named `[<story id>]` or `[<story id>/<box path>]` links itself, below a
      links.yaml entry; a tag naming a story or box that does not exist is a finding. "Refresh
      pictures" asks a running FigCraft on 127.0.0.1:4800 for PNGs of the linked frames, only
      when the file is its active tab, and never sends a command that changes a document. The
      build brief and the skill say to name a new screen's top frame `[<story id>] …`. (T51)

  - id: R29
    kind: functional
    text: >-
      `rehearse present <epic>` makes one EPIC into a deck the owner sends ahead to a supervisor
      who is not technical: one self-contained HTML file (inline CSS, SVG and pictures, nothing
      fetched, readable with scripts off) and, when Chromium can start, a PDF with one slide per
      page. Every slide comes from the record at one commit and says so in its footer: the
      EPIC's goal and why, the big picture, each story's progress, its design, how it works, what
      was checked and who signed it, the quality, the risks, the owner's asks and next steps, and
      a glossary, in plain words, unfinished work as clearly as finished work. The owner's own
      words live in `presentation.yaml`, outside the signed record. The EPIC page has a Present
      button with a preview and downloads. (T52)

  - id: R30
    kind: functional
    text: >-
      The deck says plainly what is done and what is not, with the proof for each, and where
      each proof comes from. Right after the title, a recap slide gives every story as done, in
      progress or not started, with one sentence on top. One rule decides "done" everywhere in
      the deck: the story is signed off and the sign-off is not stale, every approved scenario's
      e2e test passed in its last run, and every box of the story has code. Every story slide
      has a proof line for each source: the e2e results from Birdview (the live player, or the
      results Birdview saved in its data folder), a picture of the last screen of a recording, a
      link to the recording, unit tests from a vitest JSON report, the simulation, the built
      parts and their commits, and the signature. `--with-recordings <dir>` copies the linked
      videos next to the deck, and the EPIC page can download the deck with its recordings as a
      zip. An evidence page says where each proof comes from, and a source that is missing says
      so instead of being left out. (T53)

  - id: R31
    kind: functional
    text: >-
      `rehearse present` makes an executive summary by default, about five or six slides a
      supervisor reads in a few minutes: where we are (the goal, one status sentence and a done
      / not-yet bar), what is done (grouped by area or by role, each line with how strong its
      proof is), what is not done yet and why (grouped by reason, each with what it takes and who
      acts), how we know (what "done" means, pictures of the last screen of passed tests, the
      numbers and where they come from), and what I need from you and what is next. One rule
      decides "done" for the whole deck: built, signed off and not stale, and no test of it
      fails; how strong the proof is (seen working, partly seen working, or checked by automated
      tests) is said apart from it. `--full` and "Full deck" on the EPIC page add every story
      slide after the summary as an appendix. (T54)

  - id: R32
    kind: functional
    text: >-
      On a scenario's storyboard, beside Approve, a "Next scenario →" button (or the N key, unless
      typing in a field) opens the next scenario of the same story that is not approved with a
      valid signature yet, in review-queue order, skipping approved ones and wrapping to earlier
      ones; it names that scenario and its place ("3 of 8 in S16"). It is always there, and right
      after a successful approval focus moves to it. When the story has nothing left to approve,
      the page says "All 8 scenarios of S16 are approved" and offers "Sign off S16" (when it is
      not signed off, or its sign-off is stale) and "Next story: <story> →", which opens the first
      scenario to approve of the next story with any left; with nothing left anywhere it says
      "Every scenario of this EPIC is approved" and links back to the EPIC. The story page offers
      the same "Next story →" when all its scenarios are approved. A failed or cancelled approval
      never moves on by itself. Nothing approves or signs by itself. (T55)

  - id: R33
    kind: functional
    text: >-
      Every scenario of a story is shown as a branch of the story's main path, on one map per
      story. The main path is the scenario that takes no error edge and that the other scenarios
      follow the furthest, then the one that walks the most of the story's boxes, then the first in
      file order; the owner may pick another one in `review.yaml` (`mainPath`), which is not part of
      the signed record. Each other scenario says where it leaves the main path (the first step that
      differs; equal steps have the same box, branch and example), on what condition, and where it
      joins it again. The map is the union of the story's paths in the role lanes, each box drawn
      once and each path a line of its own. On a scenario's storyboard its path is in full colour,
      the others faded, with "Branches here: when …" and "Joins the main path again" on the map and
      "Main path" or "Branch of the main path at <step>: when <condition>" in the header. The
      opening shared with the main path collapses into one row and playback starts at the branch
      point; Approve still needs every step seen, and a collapsed step counts as seen only when the
      owner saw that same step on the main path's storyboard in this browser. The review queue, the
      story page and Next scenario follow the map: main path first, then the branches in the order
      they leave it. (T57)
  - id: R34
    kind: functional
    text: >-
      One Status page in the UI (a top-level "Status" item, also reachable from the EPIC picker)
      and `rehearse status <epic> [--json] [--not-done]` say per story whether it is signed,
      built, tested on the real screens and done, and what is missing and who acts. A header
      says "18 of 21 stories done · 2 seen working on the real screens · 3 not done"; the rows
      are not done first; filters show all, not done, or done but not seen working; a row opens
      the story's progress. "Built" is honest and has one rule for progress, the deck, the page
      and the CLI: a box is built when a Flow-Box commit names it or the code graph maps code to
      it; it needs no code of its own when it is a start or end box, or a decision whose branch
      is in the code of a built neighbour (named, with file and line); otherwise it is not built,
      and the evidence says what was looked for. No unit report, no Birdview results or no code
      graph is said in plain words, never hidden. Sources and dates are shown. Read-only. (T58)

stories:
  - id: S1
    role: builder
    want: to create an EPIC record with one command
    soThat: agents and I start from a valid, empty structure
    requirements: [R1]
    acceptance:
      - id: S1-A1
        given: a repo with no EPIC named 2026-11-05-demo
        when: the builder runs `rehearse new 2026-11-05-demo --title "Demo"`
        then: docs/epics/2026-11-05-demo/ has brainstorm.md, prd.yaml, entities.yaml, flow.yaml, corrections.md and an empty scenarios/ folder, and validate passes (git does not keep the empty folder; validate accepts a missing scenarios/)
      - id: S1-A2
        given: the EPIC 2026-11-05-demo exists
        when: the builder runs the same command again
        then: the command fails, names the folder, and changes no file

  - id: S2
    role: agent
    want: to know exactly what is wrong in a record draft
    soThat: I can fix my draft without a human
    requirements: [R2, R3, R21]
    acceptance:
      - id: S2-A1
        given: flow.yaml has a box with no `outputs`
        when: the agent runs `rehearse validate <slug>`
        then: exit code 1, and the error names flow.yaml, the box path, and the missing field
      - id: S2-A2
        given: a box points to story S9 and prd.yaml has no S9
        when: the agent runs validate
        then: exit code 1, and the error names the box path and S9
      - id: S2-A3
        given: a scenario step names a box path that does not exist
        when: the agent runs validate
        then: exit code 1, and the error names the scenario, the step and the path

  - id: S3
    role: builder
    want: to simulate the EPIC and get a list of design errors
    soThat: I find errors before agents build anything
    requirements: [R4, R5, R6, R7, R18]
    acceptance:
      - id: S3-A1
        given: box a outputs {orderId:string} and the next box b needs {orderId:number}
        when: the builder runs `rehearse simulate <slug>`
        then: the report has a contract error that names a → b and the field orderId
      - id: S3-A2
        given: a decision box has a "no" branch that no approved scenario reaches
        when: the builder runs simulate
        then: the report has a coverage error for that branch
      - id: S3-A3
        given: Order allows draft → paid only, and a scenario changes Order from draft to shipped
        when: the builder runs simulate
        then: the report has a lifecycle error that names the scenario, the box and the transition
      - id: S3-A4
        given: the end state of a scenario differs from an acceptance criterion of its story
        when: the builder runs simulate
        then: the report has an acceptance error that names the criterion ID
      - id: S3-A5
        given: the same record
        when: simulate runs two times
        then: the two reports are byte-identical

  - id: S4
    role: builder
    want: to see the flow as swimlanes and drill into boxes
    soThat: I understand who does what, and each hand-off between roles
    requirements: [R9, R12]
    acceptance:
      - id: S4-A1
        given: flow.yaml with lanes builder and system
        when: the builder opens the panel
        then: the panel shows two lanes, and each box is in the lane of its role; a box's drawer names its lane
      - id: S4-A2
        given: a box with children
        when: the builder clicks it
        then: the box drawer shows the nested diagram and a breadcrumb back to the parent; Back goes up one level
      - id: S4-A4
        given: an EPIC with stories S1 and S2 that both use box validate
        when: the builder opens the review
        then: the big picture shows every role, the main processes in flow order, and one line per story through its processes; validate is marked shared by S1 and S2 (D42)
      - id: S4-A5
        given: a story with a box that writes Story.status:draft->signed
        when: the builder opens that story
        then: the view shows WHAT (the story and its criteria), HOW (a swimlane of only its boxes, in order) and OUTPUT (Story.status draft → signed), then its scenarios (D42). A third column shows the story thread; it collapses, and the `]` key opens and closes it (C34)
      - id: S4-A6
        given: a story with scenarios
        when: the builder opens the Tests tab of that story
        then: the tab shows one row for each scenario with its e2e test status in words (passed, failed, running, not run or no test), and the Birdview player when it can play this EPIC (C35)
      - id: S4-A3
        given: '`rehearse serve` runs'
        when: the builder opens its URL in a browser
        then: the browser shows the same UI full screen

  - id: S5
    role: builder
    want: to play a scenario step by step
    soThat: I see the data move through the boxes and the roles
    requirements: [R10, R21]
    acceptance:
      - id: S5-A1
        given: an approved scenario with 3 steps
        when: the builder plays it on its storyboard (Prev, Next, Play or the arrow keys) and moves to step 2
        then: the storyboard highlights the box of step 2 and shows its input, output and state change

  - id: S6
    role: builder
    want: to approve the scenarios that agents drafted
    soThat: only scenarios I trust count as evidence
    requirements: [R13]
    acceptance:
      - id: S6-A1
        given: a draft scenario
        when: the builder approves it
        then: the scenario records approvedBy, approvedAt and a content hash
      - id: S6-A2
        given: an agent has CLI access only
        when: the agent lists the CLI commands
        then: no command approves a scenario or signs off the gate, and each scenario stays a draft
      - id: S6-A3
        given: an approved scenario
        when: its content changes
        then: the scenario becomes stale and the simulator ignores it as evidence
      - id: S6-A4
        given: no git signing key (user.signingkey) is set
        when: the builder opens a draft scenario to approve it
        then: Approve stays off and the panel shows the signing guide as text (C29, C36)
      - id: S6-A5
        given: two draft scenarios
        when: the builder approves the first one
        then: the panel goes back to the review, and the gate runs only when no scenario is left to approve (C36)

  - id: S7
    role: builder
    want: to see who may change which data, as a use case diagram
    soThat: I find a role that can change data it must not change
    requirements: [R8]
    acceptance:
      - id: S7-A1
        given: a box in the buyer lane writes Order.status
        when: the builder opens the use case diagram
        then: actor buyer links to the use case of that box, the use case is tagged "writes Order.status", and it links to the box (D42)

  - id: S8
    role: builder
    want: to see why the EPIC is ready or not ready
    soThat: I trust evidence, not a green badge
    requirements: [R11, R16]
    acceptance:
      - id: S8-A1
        given: requirement R2 has no story
        when: the builder opens the readiness view
        then: R2 shows "no proof", and the view gives the reason
      - id: S8-A2
        given: a box serves no requirement
        when: the builder opens the readiness view
        then: the box is in the list "no requirement"
      - id: S8-A3
        given: corrections.md has 3 caught-in-simulation and 1 caught-after-build
        when: the builder opens the readiness view
        then: the view shows 3 and 1

  - id: S9
    role: builder
    want: to sign off the EPIC gate
    soThat: building starts only on a simulated, approved design
    requirements: [R14, R15]
    acceptance:
      - id: S9-A1
        given: one simulator error remains
        when: the builder tries to sign off
        then: the sign-off fails and lists the error
      - id: S9-A2
        given: all gate checks pass
        when: the builder signs off
        then: the record keeps who, when and a hash for each story
      - id: S9-A3
        given: a signed EPIC, and the builder changes the text of R4
        when: the builder runs gate check
        then: only the stories linked to R4 are stale and need a new sign-off
      - id: S9-A4
        given: stories S1 and S4 selected in the Sign off tab, and S4 changed since its last sign-off
        when: the builder opens the sign-off confirmation
        then: >-
          for each story it shows what the sign-off covers (sentence, requirements,
          criteria, scenarios with their approval, boxes) and what changed since that
          story's last sign-off, read from git; if git cannot be read it says so and the
          sign-off still works (C42)

  - id: S10
    role: ci
    want: to run validate, simulate and gate check without bb
    soThat: a PR cannot merge a broken or unsigned design
    requirements: [R17, R19, R20]
    acceptance:
      - id: S10-A1
        given: a record with one simulator error
        when: CI runs `npx rehearse simulate <slug> --json`
        then: exit code 1, and the JSON lists the error
      - id: S10-A2
        given: a generated record with 200 boxes and 100 scenarios
        when: CI runs validate and simulate
        then: each one finishes in less than 2 seconds

  - id: S11
    role: builder
    want: to hand a signed story to an agent thread and watch its work in rehearse
    soThat: the agent builds what I signed, and I see what is built and tested without asking
    requirements: [R22]
    acceptance:
      - id: S11-A1
        given: a signed story that is not stale
        when: rehearse makes its build brief
        then: >-
          the brief says who signed it, when, the rule-2 hash and that it matches; it holds
          the story, its requirements and criteria, the approved scenarios (drafts apart),
          the serving boxes with contracts, children and edges, the decisions, the entities,
          and how to work; it stays under about 6k tokens
      - id: S11-A2
        given: a story that is unsigned or stale
        when: the builder opens its thread panel or asks for its brief
        then: >-
          there is no build button and no brief; rehearse says why (not signed off, or
          changed since the sign-off on <date>) and offers "Start a question thread"
      - id: S11-A3
        given: a signed story and bb
        when: the builder clicks "Build with an agent"
        then: >-
          a bb thread starts with the brief, in a new worktree from the current branch
          (--model and --reasoning-level only when set), and the link keeps the hash and time
      - id: S11-A4
        given: a build thread of a story whose plan changed after the thread started
        when: the builder opens the thread panel
        then: >-
          it says "the plan changed since this thread started", and "Send the change" tells
          the thread what changed, before and now
      - id: S11-A5
        given: a story with a build thread
        when: the builder opens the thread panel
        then: >-
          a progress block shows the thread status and last activity; per box built or not
          yet, commits, branch and coverage; per approved scenario its e2e test found,
          passing, failing or missing ("not run yet" when it did not run); gate findings and
          whether the sign-off holds; and "N of M boxes have code · K of L scenarios tested"
      - id: S11-A6
        given: an EPIC with stories
        when: the builder opens the Stories list
        then: each story shows its boxes with code, its tested scenarios and its thread status
      - id: S11-A7
        given: a repo with an EPIC
        when: an agent runs `rehearse brief <epic> <story>` or `rehearse progress <epic> <story>`
        then: >-
          it prints the brief or the progress as text, or as JSON with --json; a stale or
          unsigned story gets exit code 1 and the reason
      - id: S11-A8
        given: the bb plugin skill
        when: an agent reads it
        then: >-
          its section "Working on a story" holds the same how-to-work lines as the brief, and
          it names `rehearse brief` and `rehearse progress`

  - id: S12
    role: builder
    want: to play a story's e2e tests in Birdview with one button
    soThat: I watch the story work without setting up the player by hand
    requirements: [R23]
    acceptance:
      - id: S12-A1
        given: a story with e2e tests named after its scenarios
        when: the builder opens its Tests tab
        then: >-
          the story playlist, built from the record and the spec files, shows before anything
          plays, with "Play in Birdview" and one line "Birdview: <project> · playlist <name>"
      - id: S12-A2
        given: Birdview runs and is free
        when: the builder clicks "Play in Birdview"
        then: >-
          rehearse switches the player to this repo's test project, writes the story playlist
          through it and plays it, in that order, and the rows show live status
      - id: S12-A3
        given: Birdview plays another project
        when: the builder opens the Tests tab, plays, or clicks "Switch back"
        then: >-
          the tab says "Birdview is on <other project>. Play will switch it to this repo.";
          Play switches it; "Switch back" returns the player to its default project
      - id: S12-A4
        given: Birdview is busy (a test runs, waits or is held) or not running
        when: the builder plays or switches the project
        then: >-
          the tab says "Birdview is busy, try again" or "Birdview is not running; open it from
          the bb sidebar"; nothing is queued or retried
      - id: S12-A5
        given: a story with e2e tests
        when: the builder clicks ▶ on one test
        then: rehearse switches the project, writes the playlist, and plays that test only
      - id: S12-A6
        given: a repo with an EPIC and its e2e test project
        when: an agent runs `rehearse play <epic> <story> [--test <key>]` or `rehearse playlists <epic> --push`
        then: >-
          it plays the story or pushes every story playlist through Birdview, and exits 0;
          busy or not running exits 1 with the same words; a bad --test exits 2

  - id: S13
    role: builder
    want: to hand a scenario that has no e2e test to an agent from the Tests tab
    soThat: every approved scenario gets a test without me writing it or briefing the agent by hand
    requirements: [R24]
    acceptance:
      - id: S13-A1
        given: an approved scenario whose row on the Tests tab says "no test"
        when: the builder opens the tab
        then: >-
          the row has "Write this test with an agent"; pressing it starts one bb thread with the
          test brief of that scenario; a row with a test has no such button
      - id: S13-A2
        given: a story with K approved scenarios without an e2e test
        when: the builder presses "Write the K missing tests with an agent" on the summary line
        then: one thread starts with the test brief of all K scenarios
      - id: S13-A3
        given: a draft or stale scenario with no test
        when: the builder opens the Tests tab, or the server is asked to start a test thread for it
        then: >-
          the row says "approve this scenario first" with no button, and the server refuses
          (409) in the same words; no thread starts
      - id: S13-A4
        given: a test thread of the story has started
        when: the builder looks at the rows it has
        then: >-
          each shows the thread (status words, last activity, the @thread link); once the spec
          lands the row says "test written, not run yet", then the normal statuses after a play
      - id: S13-A5
        given: the story's test thread is working
        when: the builder presses a write button again
        then: >-
          the button reads "Send these scenarios to the running thread" and sends them with
          `bb thread tell`; no second thread starts
      - id: S13-A6
        given: approved scenarios of a story
        when: rehearse makes their test brief
        then: >-
          it holds the story sentence; per scenario given / when / then, expect, the boxes it
          walks and the criterion; the spec file and the exact test name with the Tests tab's
          rule quoted; an example spec; how to run it; "write only tests"; and how to work in
          the repo; under about 6k tokens
      - id: S13-A7
        given: a repo with an EPIC and its e2e test project
        when: an agent runs `rehearse brief <epic> <story> --tests [--scenario <id>]…`
        then: >-
          it prints the test brief and exits 0; a draft or stale scenario, or none missing,
          exits 1 with the reason; a bad argument exits 2

  - id: S14
    role: builder
    want: to merge the work of an agent thread into my branch with one button, after seeing what it brings
    soThat: an agent never has to leave its sandbox to land its work, and nothing lands that I did not see
    requirements: [R25]
    acceptance:
      - id: S14-A1
        given: a story whose build thread or test thread has commits on its branch that the current branch has not
        when: the builder opens the story's thread panel or its Tests tab
        then: >-
          rehearse shows "N commits in the thread, not in <current branch> yet" with each commit's
          subject and the files changed, and for a test thread the scenario rows the new tests fill
      - id: S14-A2
        given: that summary, and a thread bb says is idle or done
        when: the builder presses "Merge into <current branch>" and confirms the summary
        then: >-
          rehearse runs `git merge --no-ff <branch>` in serve's checkout with the message "Merge
          <thread title>" and the Co-Authored-By line the repo uses; the summary then says
          nothing is left to merge
      - id: S14-A3
        given: >-
          the checkout has uncommitted changes in files the merge touches, or the merge conflicts,
          or bb says the thread is still working, or the branch has nothing new
        when: the builder asks for the merge
        then: >-
          rehearse refuses in plain words and changes nothing: it names the dirty files; on a
          conflict it aborts the merge, lists the files and offers "Ask the thread to rebase",
          which sends the thread a message; a working thread gets no merge button
      - id: S14-A4
        given: a test thread's branch was merged
        when: the builder looks at the Tests tab
        then: >-
          the rows of the new tests say "not run", and one button "Play the new tests in
          Birdview" plays them, so the results land for this checkout's test project
      - id: S14-A5
        given: a build brief or a test brief
        when: an agent reads how to work in the repo
        then: >-
          it says to commit on the thread's branch and stop: do not merge, push or rebase onto
          main, never turn the sandbox off, say so in the thread when done because the owner
          merges from rehearse; and to set up first (install, which needs network, then build)
      - id: S14-A6
        given: the rehearse repo
        when: an agent runs `pnpm rehearse play <epic> <story> --test <key> --wait`
        then: >-
          the root script runs the CLI; it plays the test in Birdview, waits for the run to end,
          prints passed or failed (with the failed step) and exits 0 or 1; no result before
          --timeout exits 1; a bad argument exits 2
      - id: S14-A7
        given: approved scenarios of a story
        when: rehearse makes their test brief
        then: >-
          per scenario it says where each expected result shows in the app (the box that shows
          it, or "not shown in the UI, check the files"), and which fixture to start from: the
          serve fixture for a scenario that walks a UI box, the fresh repo and CLI helper for one
          that does not

  - id: S15
    role: builder
    want: the brief an agent gets to say which code already builds each box of the story
    soThat: the agent starts from the right files and functions instead of searching the repo by hand
    requirements: [R26]
    acceptance:
      - id: S15-A1
        given: a story whose boxes have code in the graph
        when: rehearse makes its build brief
        then: >-
          a section "Code you start from" follows the boxes, one block per box in the same order;
          each lists up to 8 functions that build it with path:line and the coverage badge
          ("72% · 3 tests" or "no coverage data")
      - id: S15-A2
        given: a box with earlier commits that carry its Flow-Box trailer
        when: rehearse makes the build brief
        then: the box's block lists the latest 5 of them with short sha, subject and branch
      - id: S15-A3
        given: a box with code
        when: rehearse makes the build brief
        then: >-
          its block lists up to 5 callers and 5 callees by graph rank, the tests that call it,
          and the commands to dig deeper as they run in this repo (`… context <box>`,
          `… show <symbol>`, `… coverage <box>`)
      - id: S15-A4
        given: a box with no code in the graph
        when: rehearse makes the build brief
        then: >-
          its block says "No code yet. Nearest existing code:" with the top `find` matches,
          marked as guesses, and the command to look further
      - id: S15-A5
        given: the code graph cannot open
        when: rehearse makes a build or test brief
        then: >-
          the section says so in one line and the brief still builds; the brief stays under its
          size budget in every case, and gathering the facts runs no tests
      - id: S15-A6
        given: approved scenarios of a story
        when: rehearse makes their test brief
        then: per scenario, the code of the boxes it walks in short, and the existing e2e helpers
      - id: S15-A7
        given: the how-to-work lines of the brief and of the skill
        when: an agent reads either
        then: >-
          they say to start from the section "Code you start from" and to use
          `rehearse context <box path>` before reading files by hand; the two agree
      - id: S15-A8
        given: a repo with an EPIC and its code graph
        when: an agent runs `rehearse brief <epic> <story> --json` (with or without --tests)
        then: the JSON includes the code facts of each box, or why the graph is not available

  - id: S16
    role: builder
    want: to see and edit a story's design from inside rehearse
    soThat: I and the agents build each screen to the design I drew, and the design stays next to the plan
    requirements: [R27]
    acceptance:
      - id: S16-A1
        given: '`design/links.yaml` links stories and boxes to pages of a `.figcraft` file and their PNGs'
        when: the builder runs `rehearse validate <epic>`
        then: >-
          a link to a story or box that is not in the EPIC, a file or PNG that does not exist, or a
          path outside `design/` is a finding in plain words; links.yaml is never a crash, and
          good links give no finding
      - id: S16-A2
        given: the network reaches github.com
        when: the builder runs `pnpm rehearse figcraft fetch [--version <v>]`
        then: >-
          it downloads `figcraft-web-<version>.zip` and SHA256SUMS.txt (default version: the
          installed desktop app's, else the latest release), checks the hash and unpacks into
          `.rehearse/figcraft-web/<version>/`, which git ignores; a hash mismatch exits 1 and
          changes nothing
      - id: S16-A3
        given: the web build is fetched
        when: the builder opens rehearse serve
        then: >-
          serve hosts it under `/figcraft/` on its own origin, `.wasm` as application/wasm, and
          only serve's own pages may frame it; not fetched, the Design tab says so in plain words
          with the command to run and a button that fetches it
      - id: S16-A4
        given: a story with a design link
        when: the builder opens the story's Design tab
        then: >-
          it shows the linked page's picture with the file and page; a box with its own link
          shows its picture in the box drawer; a story with no link says "No design linked" and
          the one line to add to `design/links.yaml`
      - id: S16-A5
        given: the Design tab of a linked story and the web build fetched
        when: the builder presses "Edit in FigCraft", edits and saves
        then: >-
          FigCraft opens in the page with the linked file and the tab says which page to open;
          the unsaved dot follows its changes and leaving asks first; Save writes the file back
          and says "Saved to design/<file> — commit it when you are happy"; a FigCraft that
          cannot start is said in plain words
      - id: S16-A6
        given: a save that is not a Save of the linked file
        when: FigCraft or anyone posts it to serve
        then: >-
          serve writes only a `.figcraft` file under `design/` that links.yaml names, with the
          session token and its own Origin; a path outside `design/`, with `..`, not `.figcraft`
          or not linked is refused, nothing written; Save As and exports are offered as
          downloads; no CLI command writes design files and agents never call the save route
      - id: S16-A7
        given: a story with a design link
        when: rehearse makes its build brief (thread or `rehearse brief`, with `--json` too)
        then: >-
          a section "Design" names the file, the page and the PNG, says to build the screen to
          match it, to inspect FigCraft read-only if at all, and never to write the design file;
          a story with no link gets the one line "No design linked for this story."
      - id: S16-A8
        given: a story with a design link and a test run Birdview knows
        when: the builder approves a scenario or signs off the story
        then: >-
          the design picture shows beside the latest Birdview result of the story's tests (its
          screenshot, else a link to the recording, else "no run yet"), read-only, with no new
          approval rule

  - id: S17
    role: builder
    want: to link a story to its design by picking it, not by editing YAML
    soThat: every story shows the screen it builds to, and agents name new screens so they link themselves
    requirements: [R28]
    acceptance:
      - id: S17-A1
        given: '`.figcraft` files under `design/`, one with numbered pages, one with string page ids, one too large'
        when: rehearse reads the design index
        then: >-
          each readable file lists its pages (number, name) and their top-level frames (id, name);
          a page's picture is `design/<n>-<slug>.png` when it exists, else the file's thumbnail,
          marked "file thumbnail"; a file over 64 MB or not a FigCraft zip is a finding, not a
          crash; the index is read again only when a file's size or time changes
      - id: S17-A2
        given: the story's Design tab or a box drawer, and the design index
        when: the builder presses "Link a design", picks a file, then a page or a frame
        then: >-
          one click links it: `design/links.yaml` gets the link with its comments and order kept,
          and the tab shows its picture; "Change" picks another and "Unlink" removes it; a file
          not under `design/` or not in the index is refused and nothing is written
      - id: S17-A3
        given: a story or box with no design link
        when: the builder opens its Design tab or box drawer
        then: >-
          the top 3 pages and frames whose names share words with the story's title, criteria and
          box titles show as "Suggested", each with its reason ("matches: tests, birdview") and a
          Link button; a suggestion is never linked by itself
      - id: S17-A4
        given: a frame named `[S17]`, `[S17/link-design]` or `[<epic slug>:S17]`
        when: the story has no links.yaml entry
        then: >-
          the frame links the story or box by itself and the tab says "linked by frame name"; a
          links.yaml entry wins over it, and it wins over a suggestion
      - id: S17-A5
        given: a frame tag that names a story or box that does not exist, or a story id two EPICs have without the EPIC slug
        when: the builder runs `rehearse validate <epic>`
        then: the tag is a finding in plain words, never a crash, and links nothing
      - id: S17-A6
        given: a linked story, and FigCraft running on 127.0.0.1:4800 with the linked file as its active tab
        when: the builder presses "Refresh pictures"
        then: >-
          rehearse asks FigCraft for a PNG of each linked frame (`ui.render`), writes
          `design/<n>-<slug>.png` or `design/frames/<frame-slug>.png` and says what it wrote; it
          only lists tabs and renders, never sends a command that changes a document; another
          active tab or no FigCraft is said in plain words and nothing is written
      - id: S17-A7
        given: any story
        when: rehearse makes its build brief, or an agent reads the rehearse skill
        then: >-
          both say: "If you design a new screen in FigCraft, name its top frame
          `[<story id>] <what it shows>` so it links itself."; the skill names
          `rehearse design suggest`
      - id: S17-A8
        given: an EPIC and design files under `design/`
        when: the builder or an agent runs `rehearse design suggest <epic> [--json]`
        then: >-
          it lists each unlinked story with its top suggestions and their reason, writes nothing,
          and exits 0; no readable design file exits 1, a usage error exits 2

  - id: S18
    role: builder
    want: to send my supervisor a deck of an EPIC made from its record
    soThat: they understand what is built, what is proven and what is left without opening rehearse
    requirements: [R29]
    acceptance:
      - id: S18-A1
        given: an EPIC with a goal, a brainstorm, roles and stories
        when: the builder makes its deck
        then: >-
          it opens with a title slide (the EPIC's title, its goal in one sentence, the owner, the
          date and one status line such as "15 of 17 stories signed off"), then why it exists and
          for whom with the requirements as a short plain list, then one map of the roles and
          what each of them can do
      - id: S18-A2
        given: stories at different stages
        when: the builder makes the deck
        then: >-
          a progress slide shows every story as a row of five steps (designed, scenarios approved,
          built, tested, signed off), each done, partly or not yet, with a legend and a one-line
          summary on top
      - id: S18-A3
        given: a story with criteria, scenarios, a flow and maybe a design
        when: the builder makes the deck
        then: >-
          the story has its own section: "As a …, I want …, so that …" big, its criteria as a
          checklist, its design picture when one is linked (no empty box when not), how it works
          as simple swimlanes per role, each scenario as given / when / then with who approved it
          and whether its test passed, failed, was not written or not run, and who signed it off
          and when or what is still missing
      - id: S18-A4
        given: the gate's findings and the record's tests and sign-offs
        when: the builder makes the deck
        then: >-
          a quality slide counts stories signed, scenarios approved and tests passing or missing
          and gives the gate result as OK or "N things still to do"; a risks slide lists the
          unsigned stories, stale approvals, missing and failed tests and gate findings by story,
          and the owner's own risks
      - id: S18-A5
        given: the owner's asks and next steps, or none
        when: the builder makes the deck
        then: >-
          "What I need from you" lists the asks and is left out when there are none; "What's next"
          lists the owner's next steps, else what is still to finish; a short glossary ends the deck
      - id: S18-A6
        given: any EPIC
        when: the builder makes the deck
        then: >-
          every slide reads on its own in plain words, with one to three sentences saying what the
          reader sees and why it matters; no YAML, contracts, code or ids in the main text (ids
          only small in a corner), and the glossary explains scenario, sign-off, e2e test and gate
      - id: S18-A7
        given: a story not signed off, a scenario without a test and a failing test
        when: the builder makes the deck
        then: the unsigned story, the missing test and the failing test show as plainly as the finished work, in plain words, and none is left out
      - id: S18-A8
        given: a commit of the record, with or without uncommitted changes
        when: the builder makes the deck
        then: >-
          every slide's footer says "<EPIC title> · as of <branch> @ <short sha>, <date>";
          uncommitted changes in the record show a visible notice, and with `--committed-only` the
          deck is refused and no file is written
      - id: S18-A9
        given: an EPIC with linked design pictures
        when: the builder makes the deck
        then: >-
          the deck is one HTML file that needs nothing else: inline CSS and SVG, each picture a
          data URI no wider than 1600 px, no link that fetches, arrow keys and a slide counter as
          optional script, one long page with scripts off; printing gives one landscape slide per
          page, and a PDF is made with Chromium when it can start, else the builder is told in
          plain words to print the HTML
      - id: S18-A10
        given: '`docs/epics/<slug>/presentation.yaml` with asks, next steps, risks, narration and hidden stories'
        when: the builder makes the deck, or runs validate, simulate or the gate
        then: >-
          the deck uses the asks, next steps, risks, narration and hidden stories (a hidden story is left out with "N stories not shown"); validate
          checks only their shape (an unknown slide key or story id is a finding); simulate, the
          gate and the approval and sign-off hashes ignore the file; a missing file still makes
          the deck
      - id: S18-A11
        given: rehearse serve on an EPIC
        when: the builder presses Present on the EPIC page
        then: >-
          the deck shows in rehearse as it will be sent, with arrow keys, and "Download HTML" and
          "Download PDF" give the files; a PDF with no Chromium says so in plain words; the route
          needs the session token and serve's own Origin
      - id: S18-A12
        given: a repo with an EPIC
        when: the builder runs `pnpm rehearse present <epic> [--out <file.html>] [--pdf <file.pdf>] [--committed-only]`
        then: >-
          the command writes the deck (default `presentations/<slug>-<date>-<sha>.html`, a folder git
          ignores), says the path, the size and the number of slides, and exits 0; refused
          inputs or uncommitted changes with `--committed-only` exit 1, a usage error exits 2

  - id: S19
    role: builder
    want: to have the deck open with what is done and what is not, each with its proof
    soThat: my supervisor sees where the EPIC stands and can trust it
    requirements: [R30]
    acceptance:
      - id: S19-A1
        given: an EPIC with stories that are done, in progress and not started
        when: the builder makes its deck
        then: >-
          the slide right after the title is a recap: one sentence on top such as "12 of 19
          stories are done", then every story with its name and done, in progress or not started
      - id: S19-A2
        given: stories at every stage
        when: the builder makes the deck
        then: >-
          one rule decides the state of a story everywhere in the deck: done means signed off and
          not stale, the e2e test of every approved scenario passed in its last run, and every box
          of the story has code; not started means not signed off and no box of the story has
          code; any other story is in progress
      - id: S19-A3
        given: a story with tests, recordings, a simulation, built parts and a signature
        when: the builder makes the deck
        then: >-
          the story's slide has one short proof line for each source: e2e results, a picture of
          the last screen, a link to the recording, unit tests, the simulation, the built parts
          with their commits, and the signature, each saying what it shows in plain words
      - id: S19-A4
        given: a Birdview player that does not have this project, and results Birdview saved in its data folder
        when: the builder makes the deck
        then: >-
          the deck reads the saved results and matches each one to a test by file and line, or by
          the test's title when the line moved; a saved result that matches no test is left out,
          and the deck says how many were left out
      - id: S19-A5
        given: a scenario whose e2e test left a recording
        when: the builder makes the deck
        then: >-
          the scenario shows a still picture of the last screen of the recording, no wider than
          1600 px, and a link to the recording video
      - id: S19-A6
        given: recordings linked from the deck
        when: the builder runs `pnpm rehearse present <epic> --with-recordings <dir>`, or presses "HTML + recordings (zip)" on the EPIC page
        then: >-
          the linked videos are copied into `<deck>-media/` next to the HTML and the links point
          there; the zip holds the HTML and that folder; a recording that cannot be found is
          named as missing
      - id: S19-A7
        given: a vitest JSON report
        when: the builder runs `pnpm rehearse present <epic> --unit-report <file.json>`
        then: >-
          each story slide counts the unit tests of the story's parts that passed and failed;
          a report that is missing or cannot be read is said in plain words and the deck is still
          made
      - id: S19-A8
        given: any EPIC
        when: the builder makes the deck
        then: >-
          an evidence page before the glossary says where each proof comes from (Birdview's player
          or its saved results, the recordings, the unit report, the simulation, git commits and
          the signatures) and which of these sources were found
      - id: S19-A9
        given: an EPIC with no Birdview results, no recordings or no unit report
        when: the builder makes the deck
        then: >-
          each missing source shows as missing on the story slides and on the evidence page, in
          plain words, and no story is called done without the proof that the rule asks for

  - id: S20
    role: builder
    want: >-
      the deck to be a short executive summary — where we are, what is done, what is not and
      why, and the proof
    soThat: my supervisor gets the picture in a few minutes
    requirements: [R31]
    acceptance:
      - id: S20-A1
        given: any EPIC
        when: the builder runs `pnpm rehearse present <epic>`, or presses Present on the EPIC page
        then: >-
          the deck is a summary of at most six slides, in this order: where we are (the goal,
          one status sentence such as "15 of 19 parts of the plan are done; 2 of them are seen
          working on the real screens. 4 are not done yet." and a done / not-yet bar), what is
          done, what is not done yet and why, how we know, what I need from you (only when the
          owner asks something) and what is next (the owner's next steps, else the top three the
          record suggests)
      - id: S20-A2
        given: stories at every stage
        when: the builder makes the deck
        then: >-
          one rule decides done everywhere in the deck: built, signed off and not stale, and no
          test of it fails; a done story shows how strong its proof is: seen working (every
          approved e2e test passed), partly seen working ("5 of 6") or checked by automated
          tests
      - id: S20-A3
        given: an EPIC with done stories
        when: the builder makes the deck
        then: >-
          the done slide groups them by the owner's areas in presentation.yaml, else by role,
          at most six groups of one to three short lines, each line ending with its proof level
          and the date it was last seen working
      - id: S20-A4
        given: an EPIC with stories not done
        when: the builder makes the deck
        then: >-
          the not-done slide groups them by reason (a test fails, an automated check fails,
          changed after it was signed off and needs a new sign-off, waiting for my approval,
          being built, not planned yet), each with what it takes and who acts
      - id: S20-A5
        given: passed e2e tests with recordings, a unit report and signatures
        when: the builder makes the deck
        then: >-
          the how-we-know slide says what "done" means here, shows up to four pictures of the
          last screen of passed tests with what they show and the date (linked to the recording
          with `--with-recordings`), the numbers (tests on the real screens, automated tests
          with the report date, the plan check, the signatures), where they come from (the
          commit and the date of the Birdview results), and the line "made by rehearse from the
          record and the test runs, not written by hand"
      - id: S20-A6
        given: any EPIC
        when: the builder runs `pnpm rehearse present <epic> --full`, or ticks "Full deck" on the EPIC page
        then: >-
          the deck is the same summary, then a slide "Details, story by story", then every story
          slide as before; `--with-recordings`, `--pdf`, `--committed-only` and `--unit-report`
          work with both decks
      - id: S20-A7
        given: any EPIC
        when: the builder makes the summary
        then: >-
          every slide of the summary is in plain words: no record ids, YAML keys or code in the
          text, ids only in the corner of the full deck's story slides

  - id: S21
    role: builder
    want: a Next button on the storyboard that takes me to the next scenario to approve, and to the next story when this one is done
    soThat: I can approve a whole EPIC without hunting for what is left
    requirements: [R32]
    acceptance:
      - id: S21-A1
        given: a story with scenarios left to approve, and its storyboard open on one of them
        when: the builder presses "Next scenario →" beside Approve, or N while not typing in a field
        then: >-
          the storyboard of the next scenario of the same story in review-queue order opens; the
          button named it before, with its title and its place such as "3 of 8 in S16"
      - id: S21-A2
        given: a story where some scenarios are approved with a valid signature and the open one is not the first left
        when: the builder presses "Next scenario →"
        then: >-
          approved scenarios are skipped, after the last scenario of the story it wraps to the
          earlier ones not approved yet, and it never goes to another story; on the only scenario
          of the story left, the page says it is the last one left to approve
      - id: S21-A3
        given: a scenario whose steps were all seen
        when: the builder approves it and the approval succeeds
        then: >-
          focus moves to "Next scenario →" (or to the next action when the story is done), and
          Enter follows it; nothing opens by itself
      - id: S21-A4
        given: a story whose scenarios are all approved with a valid signature
        when: the builder approves the last one, or opens one of its storyboards or its story page
        then: >-
          the page says "All 8 scenarios of S16 are approved", offers "Sign off S16" when the story
          is not signed off or its sign-off is stale (it opens the story page where the sign-off
          is, it does not sign), and "Next story: <story> →", which names the next story in
          review-queue order with scenarios to approve and opens its first one
      - id: S21-A5
        given: an EPIC where every scenario is approved with a valid signature
        when: the builder is on a storyboard or a story page
        then: the page says "Every scenario of this EPIC is approved" and offers a way back to the EPIC, and no Next story
      - id: S21-A6
        given: a scenario seen in full and no signing key in ssh-agent, or a signature the builder refuses
        when: the builder presses Approve and it fails or is cancelled
        then: >-
          the storyboard stays on the same scenario, says why, and moves no focus; "Next scenario →"
          still works

  - id: S22
    role: builder
    want: >-
      every scenario shown as a branch of the story's main path on one map, with the active one
      highlighted and only its different part to play
    soThat: I see where, when and why it leaves the normal flow without reading the same steps again
    requirements: [R33]
    acceptance:
      - id: S22-A1
        given: a story with several scenarios and no review.yaml
        when: the builder opens the story
        then: >-
          the main path is the scenario that takes no error edge and that the others follow the
          furthest, then the one that walks the most of the story's boxes, then the first in file
          order; a story with one scenario has it as its main path; when every scenario takes an
          error edge the first one is the main path and the page says so
      - id: S22-A2
        given: a review.yaml with mainPath naming a scenario of the story
        when: the owner picks the main path in the rehearse UI, or the file is read
        then: >-
          that scenario is the main path; validate reports an unknown story or scenario in it, and
          the main path is derived again; the route needs the session token and the page's Origin,
          and agents never call it
      - id: S22-A3
        given: a scenario that is not the main path
        when: it is compared with the main path
        then: >-
          it says the steps it shares from the start (same box, branch and example), the first step
          that differs and the condition there in plain words, and the box where it joins the main
          path again if it does; a step with the same box and another example differs
      - id: S22-A4
        given: a story's scenarios
        when: the builder opens the story page or a storyboard
        then: >-
          one map shows the union of the story's paths in the role lanes, the main path as the
          spine, each branch leaving at its decision with its condition and ending at its end
          state or joining again; a box many scenarios cross is drawn once; on the story page it is
          under "The story at a glance", above the scenario cards, and each branch opens its
          scenario
      - id: S22-A5
        given: the storyboard of one scenario
        when: it opens
        then: >-
          its path is in full colour and every other path is faded, not hidden, and not in the tab
          order; the arrow keys and the step detail work as before
      - id: S22-A6
        given: the storyboard of a branch
        when: it opens
        then: >-
          the map says "Branches here: when <condition>" where it leaves and "Joins the main path
          again" where it comes back, and the header says "Branch of the main path at <step>: when
          <condition>"; on the main path's storyboard the header says "Main path"
      - id: S22-A7
        given: a branch that shares its opening with the main path
        when: its storyboard opens
        then: >-
          the opening is one row, "Same as the main path up to <step> (N steps)", that can be
          expanded, and playback starts at the branch point; a collapsed step counts as seen only
          when the owner saw the same step on the main path's storyboard in this browser, else the
          row says "not seen yet on the main path — expand to see N steps" and Approve stays off
          until the steps are seen here or there
      - id: S22-A8
        given: a story with a main path and branches
        when: the builder looks at the review queue, the story page or presses Next scenario
        then: >-
          the main path comes first, then the branches in the order they leave it, each card or
          row saying "Main path" or "Branch at <step>: <condition>"
      - id: S22-A9
        given: approved scenarios and a signed-off story
        when: the owner writes or changes review.yaml
        then: >-
          no approval or sign-off goes stale: review.yaml is not part of the signed record, and
          the content hashes, simulate and gate ignore it
  - id: S23
    role: builder
    want: one Status page that says per story whether it is signed, built, tested on the real screens and done, and what is missing and who acts
    soThat: I know what is not done yet without reading the plan
    requirements: [R34]
    acceptance:
      - id: S23-A1
        given: an EPIC whose stories have boxes with Flow-Box commits, boxes the code graph maps code to, start and end boxes, and boxes with neither
        when: the builder runs `rehearse progress <epic> <story>` or opens a story's progress
        then: >-
          each box says built (with its commits and the files and symbols the graph maps to it),
          no code of its own (a start or end box), or not built (saying what was looked for:
          Flow-Box commits naming it or a box inside it, and the code graph)
      - id: S23-A2
        given: a decision box of a story
        when: rehearse decides whether it is built
        then: >-
          it needs no code of its own only when a built neighbour's code branches on it, and the
          page names that neighbour, the file and the line; with no such branch it is not built,
          and "decisions are free" is never a reason
      - id: S23-A3
        given: an EPIC with signed, changed and unsigned stories
        when: the builder opens Status or runs `rehearse status <epic>`
        then: >-
          one row per story with Signed (yes / changed since sign-off / no), Built ("8 of 8 boxes"
          or "6 of 8 — 2 left"), Tests on the real screens ("3 of 5 passed", "none yet", "1
          failing"), Automated tests (from the unit report), and Done (done · seen working, done ·
          checked by automated tests, or not done), under a header such as "18 of 21 stories done ·
          2 seen working on the real screens · 3 not done", with the sources and their dates
      - id: S23-A4
        given: a story that is not done, or done but not seen working
        when: the builder reads its row
        then: >-
          "What's missing" lists each thing and who acts: "2 boxes not built: builders", "approve 4
          scenarios: you", "sign off: you", "no real-screen test yet: test thread", "a test fails at
          <step>: builders"
      - id: S23-A5
        given: the Status page with stories in every state
        when: the builder picks All, Not done, or Done but not seen working, and clicks a row
        then: >-
          the rows are not done first, then done but not seen working, then the rest; a filter keeps
          only its rows and says how many; a row opens the story's progress, its boxes with their
          evidence and its scenarios with their tests
      - id: S23-A6
        given: any EPIC
        when: the builder runs `rehearse status <epic>`, with `--json`, or with `--not-done`
        then: >-
          it prints the same table as the page (as JSON with --json; only the stories not done with
          --not-done) and the sources, and exits 0 whatever the table says
      - id: S23-A7
        given: the same commit
        when: the builder makes the deck and opens the Status page
        then: the deck's built parts and done stories are the Status page's, from the same rule
      - id: S23-A8
        given: no unit report, no Birdview results, or no code graph yet
        when: the builder opens Status or runs `rehearse status`
        then: >-
          the Automated tests column says "not run", the real-screens column says "Birdview results
          not found", or "built" counts Flow-Box commits only, and the sources say so in plain words

resolvedQuestions:
  - question: Who is "the builder" in records?
    answer: git user.email, plus the bb thread ID when one is set.
    at: 2026-11-05
  - question: How does the tool stop an agent from approving or signing off?
    answer: Approve and sign-off are buttons in the rehearse UI only. The CLI has no such commands.
    at: 2026-11-05
