  - id: S8-tests
    title: A Vitest test and a pytest test link to the functions they call
    status: approved
    steps:
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - name: update-graph/bulk-index
        example: { id: bulk-tests, given: { tests: [ "src/orders.test.ts calls getOrderById", "api/test_orders.py calls get_order_by_id" ] }, then: { edges: [ { kind: tests, from: "orders > reads one order by its id", to: getOrderById }, { kind: tests, from: test_get_order_by_id, to: get_order_by_id } ] } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S8-A2, state: { testsEdges: [ "orders > reads one order by its id -> getOrderById", "test_get_order_by_id -> get_order_by_id" ] } }
