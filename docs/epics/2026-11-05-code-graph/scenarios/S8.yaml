story: S8
scenarios:
  - id: S8-builds
    title: A Flow-Box trailer links a box and a commit to the code it changed
    status: approved
    steps:
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - { name: update-graph/bulk-index }
      - name: update-graph/link
        example: { id: link-trailer, given: { commit: { trailer: "Flow-Box: checkout/pay", diff: "src/pay.ts lines 10-30" }, function: { name: charge, range: "10-30" } }, then: { edges: [ { kind: builds, from: "box checkout/pay", to: charge, trust: exact, source: git }, { kind: changes, from: "commit", to: charge, trust: exact, source: git } ] } }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S8-A1, state: { buildsEdge: "checkout/pay -> charge", commitEdge: "commit -> charge" } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:26:45Z'
