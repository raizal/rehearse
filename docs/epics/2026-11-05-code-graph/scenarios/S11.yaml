  - id: S11-search
    title: Builder searches words and the map jumps to the hit
    status: approved
    steps:
      - { name: open-map }
      - name: code-map
        example: { id: map-find, given: { level: packages, find: "map level", hideTests: auto, hideOutside: false }, then: { query: { verb: find, target: "map level", from: panel } } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: find }
      - name: run-query/find
        example: { id: find-map, given: { query: { verb: find, target: "map level" } }, then: { nodes: [ { name: MapIndex.level, kind: method, file: packages/graph/src/map.ts } ] } }
      - { name: run-query/answer }
      - { name: asker, branch: map }
      - name: code-map
        example: { id: map-jump, given: { level: file, target: packages/graph/src/map.ts, node: MapIndex.level, hideTests: auto, hideOutside: false }, then: { query: { verb: map, target: packages/graph/src/map.ts, from: panel } } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: map }
      - { name: map-level }
      - { name: code-map }
    expect: { criterion: S11-A5, state: { level: file, target: packages/graph/src/map.ts, selected: MapIndex.level } }
    approval:
