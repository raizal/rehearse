  - id: S11-indexing
    title: Builder opens the Code map in a repo that is not indexed yet
    status: approved
    steps:
      - { name: open-map }
      - name: code-map
        example: { id: map-first, given: { level: packages, hideTests: auto, hideOutside: false }, then: { query: { verb: map, target: packages, from: panel }, shows: "Indexing the repo…" } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - name: update-graph/hash-files
        example: { id: hash-no-db-map, given: { graphDb: missing }, then: { mode: cold } }
      - { name: update-graph/mode, branch: cold }
      - { name: update-graph/bulk-index }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
      - { name: asked, branch: map }
      - { name: map-level }
