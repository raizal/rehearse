story: S11
# The examples use this repo itself: workspace packages @rehearse/core, graph, server, ui, cli and
# bb-plugin; createGraphService in packages/server/src/graph-route.ts; MapIndex in packages/graph/src/map.ts.
scenarios:
  - id: S11-packages
    title: Builder opens the Code map and sees the packages
    status: approved
    steps:
      - { name: open-map }
      - name: code-map
        example: { id: map-open, given: { level: packages, hideTests: auto, hideOutside: false }, then: { query: { verb: map, target: packages, from: panel } } }
      - name: serve-query
        example: { id: serve-map, given: { token: "session token", origin: same }, then: { query: { verb: map, target: packages, from: panel } } }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: map }
      - name: map-level
        example: { id: level-packages, given: { query: { verb: map, target: packages } }, then: { nodes: [ "@rehearse/core", "@rehearse/graph", "@rehearse/server", "@rehearse/ui", "@rehearse/cli", "@rehearse/bb-plugin", "Outside packages (N)" ], edges: [ { from: "@rehearse/server", to: "@rehearse/graph", count: 12 } ], notes: [ "6 packages, N outside" ] } }
      - { name: code-map }
    expect: { criterion: S11-A1, state: { nodesPerPackage: 1, outsideGroup: "Outside packages (N)", edgesCounted: true, namesReadable: true } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-07T02:27:23Z'
      hash: 'sha256:94df2912ae7c3fd86e0c2f5d85673074c0d0c87fef3d1f2ba47a62231765cbf4'
