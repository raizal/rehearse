  - id: S7-openapi
    title: An OpenAPI operationId makes the http-calls edge exact
    status: approved
    steps:
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - { name: update-graph/bulk-index }
      - name: update-graph/link
        example: { id: link-openapi, given: { openapi: { operationId: getOrder }, client: { operationId: getOrder } }, then: { edges: [ { kind: http-calls, to: get_order, trust: exact, source: openapi } ] } }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S7-A2, state: { httpCallsEdge: "loadOrder fetch -> get_order", trust: exact } }
