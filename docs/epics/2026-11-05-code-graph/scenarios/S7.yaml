story: S7
scenarios:
  - id: S7-url-match
    title: A fetch URL matches a FastAPI route by name
    status: approved
    steps:
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - { name: update-graph/bulk-index }
      - name: update-graph/link
        example: { id: link-url, given: { route: { method: GET, path: "/api/orders/{order_id}", handler: get_order }, fetch: { method: GET, url: "/api/orders/{id}" } }, then: { edges: [ { kind: http-calls, from: "fetch in loadOrder", to: get_order, trust: name-match } ] } }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S7-A1, state: { httpCallsEdge: "loadOrder fetch -> get_order", trust: name-match } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:26:39Z'
