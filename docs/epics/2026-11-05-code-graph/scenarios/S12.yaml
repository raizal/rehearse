    status: approved
    steps:
      - { name: open-map }
      - name: code-map
        example: { id: map-coverage, given: { level: file, target: src/pay.ts, hideTests: auto, hideOutside: false }, then: { query: { verb: map, target: src/pay.ts, from: panel } } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: map-nodes-coverage, given: { query: { verb: map, target: src/pay.ts } }, then: { answer: { nodes: [ { name: charge, coverage: { percent: 80, tests: 1 } } ] } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A1, state: { levels: [ package, folder, file, function ], badge: "80% · 1 test", tone: green } }
    approval:
