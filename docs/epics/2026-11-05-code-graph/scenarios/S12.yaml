story: S12
# The examples use the test fixture of packages/server/test/graph.test.ts: src/pay.ts with the
# function charge on lines 10-30, lines 13-16 not run, and one branch on line 11 taken once of two.
scenarios:
  - id: S12-box-badges
    title: Builder opens a box drawer and sees the coverage badge of the box and its children
    status: draft
    steps:
      - { name: open-box }
      - name: drill-code
        example: { id: drill-coverage, given: { box: checkout }, then: { query: { verb: coverage, from: panel } } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: boxes-coverage, given: { query: { verb: coverage } }, then: { answer: { boxes: { checkout: { percent: 80, tests: 3 }, checkout/pay: { percent: 80, tests: 3 } } } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A1, state: { drawerBadge: "80% · 3 tests", tone: green, parentIsSumOfChildren: true, boxCode: "builds edges, else Flow-Box files" } }

  - id: S12-map-badges
    title: Builder opens the Code map and sees badges on packages, folders, files and functions
    status: draft
    steps:
      - { name: open-map }
      - name: code-map
        example: { id: map-coverage, given: { level: file, target: src/pay.ts, hideTests: auto, hideOutside: false }, then: { query: { verb: map, target: src/pay.ts, from: panel } } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: map-nodes-coverage, given: { query: { verb: map, target: src/pay.ts } }, then: { answer: { nodes: [ { name: charge, coverage: { percent: 80, tests: 1 } } ] } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A1, state: { levels: [ package, folder, file, function ], badge: "80% · 1 test", tone: green } }

  - id: S12-orange-red
    title: Badges are orange from 50% to 79% and red below 50%
    status: draft
    steps:
      - { name: open-box }
      - { name: drill-code }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: tones, given: { query: { verb: coverage } }, then: { answer: { boxes: { ship: { percent: 72 }, send: { percent: 20 }, pay: { percent: null } } } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A1, state: { ship: orange, send: red, pay: "no coverage data" } }

  - id: S12-line-marks
    title: Builder reads a function below a leaf box with green and red line marks
    status: draft
    steps:
      - { name: open-box }
      - name: drill-code
        example: { id: drill-charge, given: { box: checkout/pay }, then: { query: { verb: show, target: charge, from: panel } } }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: charge-lines, given: { query: { verb: show, target: charge } }, then: { answer: { coverage: { lines: { "10": run, "11": partial, "13": missed }, uncovered: [ "13-16" ] } } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A2, state: { line10: green, line13: red, line11: "branches partly taken (1 of 2)", commentLine: none } }

  - id: S12-tested-by
    title: Builder sees the tests that call a function and opens one
    status: draft
    steps:
      - { name: open-box }
      - { name: drill-code }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: charge-tests, given: { query: { verb: show, target: charge } }, then: { answer: { testedBy: [ { name: "charges the card", via: direct }, { name: "refunds an order", via: helper } ] } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A3, state: { testedBy: [ "charges the card (calls it)", "refunds an order (through a helper)" ], opensTestCode: true } }

  - id: S12-stale
    title: Coverage older than the code says to run the tests again
    status: draft
    steps:
      - { name: open-box }
      - { name: drill-code }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: stale, given: { query: { verb: show, target: charge }, lcovOlderThan: src/pay.ts }, then: { answer: { coverage: { percent: 80, stale: true } } } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A4, state: { badgeMark: "⟳", line: "coverage is older than this code; run the tests again" } }

  - id: S12-no-data
    title: A repo with no coverage file shows one line on how to make one
    status: draft
    steps:
      - { name: open-map }
      - { name: code-map }
      - { name: serve-query }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        branch: no-coverage
        example: { id: no-lcov, given: { query: { verb: coverage } }, then: { exit: no-coverage, found: false } }
      - name: no-coverage
        example: { id: hint, given: { found: false }, then: { hint: "No coverage file yet. Run `pnpm coverage` to write coverage/lcov.info in each package." } }
      - { name: coverage-asker, branch: panel }
      - { name: show-coverage }
      - { name: seen }
    expect: { criterion: S12-A5, state: { line: "No coverage file yet. Run `pnpm coverage` …", zeroPercentBadges: 0 } }

  - id: S12-cli
    title: Agent runs rehearse coverage on a function and gets the lines not run
    status: draft
    steps:
      - { name: start }
      - { name: ask }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        example: { id: cli-charge, given: { query: { verb: coverage, target: charge, from: cli } }, then: { answer: { kind: node, stats: { percent: 80 }, entries: [ { name: charge, uncovered: [ "13-16" ] } ], exitCode: 0 } } }
      - { name: coverage-asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S12-A6, state: { firstLine: "function charge: 80% · 1 test", notRun: "13-16", jsonSameFields: true, notFoundExit: 1, usageExit: 2 } }

  - id: S12-cli-no-data
    title: Agent runs rehearse coverage in a repo with no coverage file
    status: draft
    steps:
      - { name: start }
      - { name: ask }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: coverage }
      - name: read-coverage
        branch: no-coverage
        example: { id: cli-no-lcov, given: { query: { verb: coverage, target: src/pay.ts, from: cli } }, then: { exit: no-coverage, found: false } }
      - { name: no-coverage }
      - { name: coverage-asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S12-A5, state: { firstLine: "file src/pay.ts: no coverage data", hint: "No coverage file yet …", exitCode: 0 } }

  - id: S12-refused
    title: A coverage request without the session token gets 403
    status: draft
    steps:
      - { name: open-box }
      - { name: drill-code }
      - name: serve-query
        branch: forbidden
        example: { id: serve-coverage-forbidden, given: { token: null }, then: { exit: forbidden, status: 403, body: "no coverage data" } }
      - { name: refused }
    expect: { criterion: S12-A7, state: { status: 403, graphOpened: false } }
