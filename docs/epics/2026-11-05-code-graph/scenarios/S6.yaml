  - id: S6-trust-ts
    title: A resolved call is exact and a computed call is name-match
    status: approved
    steps:
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - name: update-graph/bulk-index
        example: { id: bulk-trust, given: { calls: [ "loadRow(id)", "handlers[name](id)" ] }, then: { edges: [ { to: loadRow, kind: calls, trust: exact, source: ts-morph }, { to: handle, kind: calls, trust: name-match, source: tree-sitter } ] } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S6-A2, state: { firstEdge: exact, secondEdge: name-match } }
    approval:
