story: S6
scenarios:
  - id: S6-scope
    title: The index reads the tsconfig files and keeps node_modules out
    status: approved
    steps:
      - name: update-graph/scope
        example: { id: scope-monorepo, given: { tsconfigs: [ packages/a/tsconfig.json, packages/b/tsconfig.build.json ], dirs: [ node_modules ] }, then: { tsconfigs: [ packages/a/tsconfig.json, packages/b/tsconfig.build.json ], files: [ packages/a/src/index.ts, packages/b/src/index.ts ] } }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - name: update-graph/bulk-index
        example: { id: bulk-target-only, given: { call: "lodash.get()" }, then: { nodes: [ { name: "lodash.get", targetOnly: true } ] } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S6-A1, state: { indexedTsconfigs: 2, nodeModulesFilesIndexed: 0, lodashGet: target-only } }
    approval:
