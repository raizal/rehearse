  - id: S6-python-venv
    title: Python calls into the venv are exact on a host with no Python
    status: approved
    steps:
      - name: update-graph/scope
        example: { id: scope-venv, given: { dirs: [ .venv ], hostPython: none }, then: { venv: .venv } }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: cold }
      - name: update-graph/bulk-index
        example: { id: bulk-python, given: { calls: [ "load_row(id)", "requests.get(url)" ] }, then: { edges: [ { to: load_row, trust: exact }, { to: "requests.get", trust: exact } ], run: { resolvers: [ tree-sitter, scip-python ] } } }
        # basedpyright runs on updates only; a cold index uses the bulk resolvers (S6-A4, C5).
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S6-A3, state: { repoCalls: exact, requestsCalls: exact, resolvers: "scip-python from npm on a cold index" } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:24:40Z'
