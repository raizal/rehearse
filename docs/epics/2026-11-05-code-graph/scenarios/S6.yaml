  - id: S6-bulk-resolvers
    title: A cold index uses the bulk resolvers and no LSP request for each call site
    status: approved
    steps:
      - { name: update-graph/scope }
      - name: update-graph/hash-files
        example: { id: hash-no-db-2, given: { graphDb: missing }, then: { mode: cold } }
      - { name: update-graph/mode, branch: cold }
      - name: update-graph/bulk-index
        example: { id: bulk-resolvers, given: {}, then: { run: { mode: cold, resolvers: [ tree-sitter, ts-morph, scip-python ] }, lspRequestsPerCallSite: 0 } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
    expect: { criterion: S6-A4, state: { IndexRun.resolvers: [ tree-sitter, ts-morph, scip-python ], lspRequestsPerCallSite: 0 } }
