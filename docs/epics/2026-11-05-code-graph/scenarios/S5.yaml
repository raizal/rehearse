story: S5
scenarios:
  - id: S5-update-one-file
    title: Agent changes one file and the next query updates only that file
    status: draft
    steps:
      - { name: start }
      - { name: ask }
      - { name: update-graph/scope }
      - name: update-graph/hash-files
        example: { id: hash-one-changed, given: { changedOnDisk: [src/orders.ts] }, then: { mode: update, changed: [src/orders.ts], removed: [] } }
      - { name: update-graph/mode, branch: update }
      - name: update-graph/warm-update
        example: { id: warm-one, given: { changed: [src/orders.ts] }, then: { run: { mode: update, changedFiles: 1, trigger: query } } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: show }
      - { name: run-query/show }
      - { name: run-query/answer }
      - { name: asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S5-A1, state: { IndexRun.changedFiles: 1, IndexRun.status: written, answerHasNewCode: true } }

  - id: S5-cold-first-query
    title: The first query in a repo makes the graph
    status: draft
    steps:
      - { name: start }
      - { name: ask }
      - { name: update-graph/scope }
      - name: update-graph/hash-files
        example: { id: hash-no-db, given: { graphDb: missing }, then: { mode: cold } }
      - { name: update-graph/mode, branch: cold }
      - { name: update-graph/bulk-index }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - name: update-graph/write
        example: { id: write-db, given: { }, then: { files: [.rehearse/graph.db], gitStatus: clean } }
        # Question: .rehearse/graph.db* must be in .gitignore. See prd S5-A2.
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: find }
      - { name: run-query/find }
      - { name: run-query/answer }
      - { name: asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S5-A2, state: { graphDbExists: true, IndexRun.mode: cold, answered: true, gitStatusNewFiles: 0 } }
