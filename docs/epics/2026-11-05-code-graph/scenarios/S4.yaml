story: S4
scenarios:
  - id: S4-context-budget
    title: Agent gets the code around a function in a token budget
    status: approved
    steps:
      - { name: start }
      - name: ask
        example: { id: ask-context, given: { verb: context, target: getOrderById, budget: 2000, json: true }, then: { query: { verb: context, target: getOrderById, budget: 2000, from: cli } } }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: context }
      - name: run-query/context
        example: { id: context-budget, given: { node: getOrderById, linkedChars: 9000, budget: 2000 }, then: { bundle: { tokens: 1988, items: [ getOrderById, loadRow, loadOrder, "orders > reads one order by its id, with the total of its lines in cents" ] } } }
        # items: target first, then graph distance 1 (by PageRank), then distance 2.
        # The fourth item is the test node in src/orders.test.ts. It has both a calls edge and a
        # tests edge to getOrderById; the calls edge is found first, so its role is caller. (C7)
      - { name: run-query/answer }
      - { name: asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S4-A1, state: { bundleTokensAtMost: 2000, firstItem: getOrderById, order: "graph distance, then PageRank" } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:26:14Z'
      hash: 'sha256:51bd4924f6fbae6218d86e1439ddf5864e429d32604734074b4b5f185fc2504a'
      sig: |
        -----BEGIN SSH SIGNATURE-----
        U1NIU0lHAAAAAQAAADMAAAALc3NoLWVkMjU1MTkAAAAg1MPJouVIt2JUVE9BT0opc0Ji3b
        j3EDqvCto7oe8WMEEAAAAIcmVoZWFyc2UAAAAAAAAABnNoYTUxMgAAAFMAAAALc3NoLWVk
        MjU1MTkAAABAc1IpN42Q1NK6P0EGCLvLxtFVhyPLMg+QCs+mbFJXlSeYipbtE1cDrZPTJG
        V1mRviYyQZbxLPbKza5DQiTIL/Cw==
        -----END SSH SIGNATURE-----

  - id: S4-no-venv
    title: Agent asks about a Python repo that has no virtual environment
    status: approved
    steps:
      - { name: start }
      - { name: ask }
      - name: update-graph/scope
        example: { id: scope-no-venv, given: { repo: "api/ only, no .venv, no uv, no poetry, no pyright venv" }, then: { files: [ api/orders.py ], tsconfigs: [], venv: null } }
      - name: update-graph/hash-files
        example: { id: hash-cold, given: { graphDb: missing }, then: { mode: cold } }
      - { name: update-graph/mode, branch: cold }
      - name: update-graph/bulk-index
        example: { id: bulk-no-venv, given: { venv: null }, then: { edges: [ { to: get_order_by_id, trust: exact }, { to: "fastapi.APIRouter", trust: unresolved } ], run: { resolvers: [ tree-sitter, scip-python ] } } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - name: update-graph/write
        example: { id: write-cold, given: { run: { status: running } }, then: { run: { status: written } } }
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: context }
      - name: run-query/context
        example: { id: context-no-venv, given: { node: get_order_by_id }, then: { bundle: { notes: [ "no venv found" ] } } }
      - name: run-query/answer
        example: { id: answer-no-venv, given: {}, then: { answer: { ok: true, exitCode: 0, notes: [ "no venv found" ] } } }
      - { name: asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S4-A2, state: { exitCode: 0, note: "no venv found", repoEdges: exact, thirdPartyEdges: unresolved } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:23:45Z'
      hash: 'sha256:13c77e84bf7054e1cddf28bb56d59ae57c28bda44641e94209fcb623b98b066e'
