# The change of the code-graph EPIC to docs/system/architecture.yaml (D43).
# The review UI applies it on top of the as-is system. Each item says why (G-ids) and
# which stories need it.
version: 1
about: rehearse v1, with a code graph that agents and the builder can ask (G9).
components:
  - id: graph
    # changed, not added: the component landed in docs/system/architecture.yaml (C4).
    change: changed
    name: '@rehearse/graph'
    zone: repo
    about: 'index: tree-sitter · ts-morph · scip-python · basedpyright · OpenAPI · git trailers; query: BM25 · PageRank · find · show · near · path · context'
    code: [packages/graph/src]
    what: 'New package. It is not a module of core: core stays small for CI, and the graph has WASM, ts-morph and Python resolver dependencies, its own store and its own speed targets.'
    why: [G2, G4, G10, G14, G15, G16, G17, G19, G23, G25, G26, G27, G28, G30, G31]
    stories: [S1, S2, S3, S4, S6, S7, S8]
    # Zone repo: the graph does no signing and no approval, so it needs no trust zone (G31).
  - id: graph-db
    change: added
    name: .rehearse/graph.db
    kind: store
    zone: repo
    about: 'SQLite + FTS5: nodes, edges, file hashes, index runs'
    what: 'A cache, not a record file. `rehearse new` adds .rehearse/graph.db* to .gitignore. --rebuild makes it again.'
    why: [G3, G5, G29]
    stories: [S5]
  - id: graph-bench
    change: added
    name: graph benchmark
    zone: ci
    about: 'cold index of 1,000 files < 30 s · update < 300 ms · query < 100 ms (medians, freshness check included)'
    what: 'A CI step that fails the build when the graph is too slow. The fixture: 1,000 generated files, fixed seed. Planned until the repo has CI.'
    planned: true
    why: [G11, G24]
    stories: [S10]
  - id: cli
    change: changed
    about: new · validate · simulate · gate check · serve · find · show · near · path · context
    what: '+ find · show · near · path · context, each with --json and --rebuild; near --depth; new adds .rehearse/graph.db* to .gitignore'
    why: [G1, G7, G26, G29]
    stories: [S1, S2, S3, S4]
  - id: serve
    change: changed
    about: 127.0.0.1:<port> · session token · Origin check · /api/* · graph route · file watcher
    what: '+ watches the source files and updates the graph; + one route GET /api/graph?verb=show|near&target=… for the panel, with the session token and the Origin check'
    why: [G5, G8, G20, D45]
    stories: [S9]
  - id: ui
    change: changed
    about: 'React app: Big picture, Stories, Use cases, Readiness, Sign off · code drill-down'
    what: '+ code drill-down below a leaf box: code, AST, call graph, read only'
    why: [G8, D19, D44]
    stories: [S9]
  - id: repo
    change: changed
    about: docs/epics/<slug>/*.yaml · .rehearse/allowed_signers · source code · commits with Flow-Box trailers
    what: '+ the graph reads the source code and the Flow-Box: commit trailers'
    why: [G13, D44]
    stories: [S8]
