        j3EDqvCto7oe8WMEEAAAAIcmVoZWFyc2UAAAAAAAAABnNoYTUxMgAAAFMAAAALc3NoLWVk
        MjU1MTkAAABA17xOXI9Hzzqf71GoKrOM3fp1xDP5/VIz5pOrnuEPFLSs74tAbojqRIjcsn
        /ytmrYXknNXq0TOKgp/W2B6ax6Cw==
        -----END SSH SIGNATURE-----

  - id: S5-rebuild
    title: Agent asks for a full rebuild with --rebuild
    status: approved
    steps:
      - { name: start }
      - name: ask
        example: { id: ask-rebuild, given: { verb: find, target: "order by id", rebuild: true }, then: { query: { verb: find, target: "order by id", rebuild: true } } }
      - { name: update-graph/scope }
      - name: update-graph/hash-files
        example: { id: hash-rebuild, given: { changedOnDisk: [], query: { rebuild: true } }, then: { mode: cold, changed: [ src/orders.ts, src/pay.ts, api/orders.py ], removed: [] } }
      - { name: update-graph/mode, branch: cold }
      - { name: update-graph/bulk-index }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: find }
      - { name: run-query/find }
      - { name: run-query/answer }
      - { name: asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S5-A3, state: { IndexRun.mode: cold, IndexRun.status: written, answered: true } }
    approval:
