story: S9
scenarios:
  - id: S9-drill-down
    title: Builder opens a leaf box and sees the code that builds it
    status: approved
    steps:
      - { name: open-box }
      - name: drill-code
        example: { id: drill-pay, given: { box: checkout/pay }, then: { query: { verb: show, target: "box checkout/pay", from: panel } } }
      - name: serve-query
        example: { id: serve-ok, given: { token: "session token", origin: same }, then: { query: { verb: show, target: "box checkout/pay", from: panel } } }
      - { name: update-graph/scope }
      - { name: update-graph/hash-files }
      - { name: update-graph/mode, branch: none }
      - { name: update-graph/unchanged }
      - { name: update-graph/fresh }
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: show }
      - name: run-query/show
        example: { id: show-box, given: { node: "box checkout/pay" }, then: { nodes: [ charge ], edges: [ { kind: builds, to: charge, trust: exact } ] } }
      - { name: run-query/answer }
      - { name: asker, branch: panel }
      - name: code-view
        example: { id: view-charge, given: { answer: "charge" }, then: { view: [ code, ast, call-graph ], editable: false } }
      - { name: seen }
    expect: { criterion: S9-A1, state: { panelShows: [ code, ast, call-graph ], readOnly: true } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:26:52Z'
      hash: 'sha256:471576adc9f0799f702105076e89cd2cbf718214d6ec926670eb20e05070d973'
