  - id: S9-watch-save
    title: Builder saves a file and the watcher updates the graph
    status: approved
    steps:
      - { name: file-saved }
      - name: watch
        example: { id: watch-pay, given: { path: src/pay.ts }, then: { changed: [ src/pay.ts ] } }
      - { name: update-graph/scope }
      - name: update-graph/hash-files
        example: { id: hash-pay, given: { changedOnDisk: [ src/pay.ts ] }, then: { mode: update, changed: [ src/pay.ts ] } }
      - { name: update-graph/mode, branch: update }
      - name: update-graph/warm-update
        example: { id: warm-pay, given: { changed: [ src/pay.ts ] }, then: { run: { mode: update, trigger: watch, changedFiles: 1 } } }
      - { name: update-graph/link }
      - { name: update-graph/rank }
      - { name: update-graph/write }
      - { name: update-graph/fresh }
      - { name: asked, branch: "no" }
      - { name: graph-updated }
    expect: { criterion: S9-A3, state: { IndexRun.mode: update, IndexRun.trigger: watch, panelShowsSavedCode: true } }
    approval:
      by: raizal.pregnanta@systemearth.com
      at: '2026-11-06T04:26:59Z'
      hash: 'sha256:b48b807c606cab6d5e2422fb5312cf7f9add6207f501b25c377e1016a6f5a0d7'
