  - id: S1-find-both
    title: Agent finds the TypeScript and the Python function with the same words
    status: approved
    steps:
      - { name: asked, branch: "yes" }
      - { name: run-query/target }
      - { name: run-query/verb, branch: find }
      - name: run-query/find
        example: { id: find-both, given: { query: { verb: find, target: "order by id" } }, then: { nodes: [ { name: getOrderById, terms: "get order by id" }, { name: get_order_by_id, terms: "get order by id" } ] } }
      - { name: run-query/answer }
      - { name: asker, branch: cli }
      - { name: got-it }
    expect: { criterion: S1-A2, state: { hits: [ getOrderById, get_order_by_id ], embeddings: none } }
